# Seat Records — the org chart as data
# ------------------------------------
# One record per box on the chart. Filled boxes are individuals; open roles are
# dashed boxes (multi-position roles use headcount, e.g. "3 open seats").
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
# Never hand-edit anything in 02-organization/generated/.
#
# Controlled vocabularies
#   status:           defined | approved | sourcing | interviewing | selected |
#                     clearance-ethics | filled | hold
#                     (labels shown: Not started / Approved / Sourcing / In talks /
#                      Selected / In screening / On board / On hold)
#   team:             leadership | investment | legal | research | front-office |
#                     advisors | chips | commerce
#   hiring_authority: detailee | ipa | sge | secondee | excepted | direct-hire |
#                     schedule-c | tbd
#   funded:           yes | no | tbd
#
# Optional fields:
#   incumbent:        name, once filled
#   lead:             true — leadership seat; gets the accent bar on the chart
#   tier: deputy      drawn on its own row between the ED and the teams
#   context: true     Commerce-level seat drawn small beside the ED at the top —
#                     same level as the ED (they all report to the Secretary);
#                     excluded from USIA hiring counts
#   wave:             hiring priority (1 = now, 2 = sequenced behind wave 1)


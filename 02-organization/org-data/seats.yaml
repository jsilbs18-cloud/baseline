    title: Executive Director
    team: leadership
    bucket: leadership
    reports_to: secretary          # external anchor node
    headcount: 1
    wave: 0
    status: filled
    hiring_authority: schedule-c
    funded: yes
    incumbent: "TBD — enter name"
    notes: "Reports directly to the Secretary of Commerce per EO 14255."


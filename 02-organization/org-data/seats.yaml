# Seat Records — the org chart as data
# ------------------------------------
# One record per seat (position). Seats are stable; people are not. Candidates
# flow toward seats in candidates.yaml and join on the seat `id`.
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
# Never hand-edit anything in 02-organization/generated/.
#
# Controlled vocabularies
#   status:           defined | approved | sourcing | interviewing | selected |
#                     clearance-ethics | filled | hold
#                       defined          seat exists on paper only
#                       approved         billet approved and funded; not yet recruiting
#                       sourcing         actively building the candidate slate
#                       interviewing     candidates in interviews
#                       selected         selection made; pre-clearance/ethics
#                       clearance-ethics selectee in clearance, ethics, or paperwork
#                       filled           incumbent on board
#                       hold             deliberately paused
#   team (Model C reporting lines): leadership | deals | toolkit-structuring |
#                     portfolio | front-office
#   bucket (simple rollup view):    leadership | investment | legal | administrative
#   hiring_authority: detailee | ipa | sge | excepted | direct-hire | schedule-c | tbd
#   funded:           yes | no | tbd
#   wave:             1-4, per 02-organization/roles-and-hiring.md
#
# Optional per-seat action tracking (shows up on the hiring dashboard):
#   next_action:      short imperative, e.g. "Confirm billet with Commerce HR"
#   next_action_date: YYYY-MM-DD
#   action_owner:     who moves it (ed | cos | hr | ...)

seats:


# Seat Records — the org chart as data
# ------------------------------------
# One record per seat (position). Seats are stable; people are not. Candidates
# flow toward seats in candidates.yaml and join on the seat `id`.
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
# Never hand-edit anything in 02-organization/generated/.
#
# Controlled vocabularies
#   status:           defined | approved | sourcing | interviewing | selected |
#                     clearance-ethics | filled | hold
#   team:             leadership | investment | legal | research | front-office |
#                     advisors | chips | commerce
#   hiring_authority: detailee | ipa | sge | secondee | excepted | direct-hire |
#                     schedule-c | tbd
#   funded:           yes | no | tbd
#
# Optional fields:
#   incumbent:        name, once filled. For multi-headcount seats use a list —
#                     incumbent: ["A. Name", "B. Name"] — and the views show n of N.
#   acting:           someone covering the seat without holding it
#   lead:             true — leadership seat; gets the accent bar on the chart
#   context: true     Commerce-level seat shown for context around USIA; drawn
#                     beside the Secretary, excluded from USIA hiring counts
#   wave:             hiring priority group (1 = now, 2 = sequenced behind wave 1)

seats:


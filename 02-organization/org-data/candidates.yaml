# Candidate Records — the hiring pipeline as data
# -----------------------------------------------
# One record per candidate. Candidates join to seats (seats.yaml) via
# `target_seats` and to their origin (sources.yaml) via `via`, or free-text
# `origin` when the origin isn't a tracked source.
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
#
# The pipeline mirrors how hiring actually works here: the ED decides who he
# wants, then they go through the approval machinery, then they start.
#
# Controlled vocabularies
#   stage:      to-meet | waiting | screening | cleared | stalled |
#               joined | passed | withdrawn
#                 to-meet    identified, haven't spoken yet
#                 waiting    spoken; ED wants them / waiting to hear back
#                 screening  said yes; in the approval machinery (divestiture,
#                            disclosure, detail paperwork, clearance)
#                 cleared    approved — start date being set
#                 stalled    parked / gone quiet (still visible, own column)
#                 joined     on board (also flip the seat to `filled`)
#                 passed     we passed
#                 withdrawn  candidate withdrew
#   source:     referral | search | detailee | ipa | inbound | network
#   clearance:  active | eligible | none | unknown
#
# Handling: this file contains PII and pre-decisional personnel assessments.
# Keep the repository access-controlled.


# Candidate Records — the hiring pipeline as data
# -----------------------------------------------
# One record per candidate. Candidates join to seats (seats.yaml) via
# `target_seats` and to their origin (sources.yaml) via `via` — many-to-many
# with seats: one candidate can be in play for several seats, one seat can
# carry several candidates.
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
#
# Controlled vocabularies
#   stage:      sourced | screened | interviewing | selected | clearance-ethics |
#               eod | bench | hold | declined | withdrawn
#                 sourced           identified, not yet assessed
#                 screened          assessed against the role card; worth pursuing
#                 interviewing      in interviews
#                 selected          selection made, offer extended/accepted
#                 clearance-ethics  security clearance, ethics review, HR paperwork
#                 eod               entered on duty (also flip the seat to `filled`)
#                 bench             good person, no current seat — keep for later waves
#                 hold              paused (timing, budget, candidate availability)
#                 declined          we passed
#                 withdrawn         candidate withdrew
#   source:     referral | search | detailee | ipa | inbound | network
#   clearance:  active | eligible | none | unknown
#                 (drives the post-selection timeline more than anything else —
#                  check it at SCREENING, not at selection)
#
# Fields
#   via:   id of the source (sources.yaml) that produced this candidate
#   log:   dated notes, newest first — interview reads, what they said, status
#   next_action / next_action_date: optional — use when there IS a concrete next
#          step; nothing forces a date on every record
#
# Conflicts note: candidates from banking/PE/industry will carry recusal scope.
# Assess `conflicts` at screening; an SGE advisor with broad deal conflicts may
# be unusable regardless of talent.
#
# Handling: this file contains PII and pre-decisional personnel assessments.
# Keep the repository access-controlled; move records to the approved
# environment if your information-handling rules require it.

candidates:

  # EXAMPLE RECORD — fictional; delete when you add real candidates.
  - id: example-doe
    name: "EXAMPLE — Jane Doe"
    current_role: "Managing Director, Example Capital Partners"
    target_seats: [head-deals]
    stage: screened
    owner: ed
    source: referral
    via: example-hargrove
    clearance: none
    conflicts: "Active fund positions in two semiconductor names — likely recusal
      on those issuers; assess breadth before IPA paperwork."
    availability: "90-day notice period"
    log:
      - date: 2026-07-22
        note: "Strong structuring background; ED to decide on interview."
    updated: 2026-07-27

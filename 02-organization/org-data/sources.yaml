# Source Records — the sourcing/outreach layer
# ---------------------------------------------
# One record per place the ED fishes for talent: a company, a government office,
# an individual person, or a group/association. Sources produce candidates
# (candidates.yaml), who fill seats (seats.yaml).
#
# Edit this file, then regenerate the views:
#     python3 tools/generate_org_views.py
#
# Controlled vocabularies
#   type:    private | government | person | group
#   status:  to-call | called-waiting | produced | dry
#            (columns shown: Need to call / Called — waiting / Produced;
#             Dry only appears once something lands there)
#   ball_in_court: them | us   (optional; only while called-waiting)
#
# Fields
#   for:        what we're fishing for, free text
#   why:        rationale for calling (esp. on the need-to-call list)
#   produced:   list of candidate ids this source yielded
#   log:        dated notes, newest first — what they actually said
#
# Handling: sensitive relationship intelligence. Keep the repository
# access-controlled.


# Counterpart Entities — the institution view of the federal toolkit
# --------------------------------------------------------------------
# One record per federal capital-formation entity. Researched from public
# sources with independent verification (research date below); the
# `usia_angle` and `matrix` fields are authored judgment, not research.
# Regenerate views:  python3 tools/generate_counterpart_map.py
# Facts drift: leadership, capacity, and reauthorization status change —
# re-verify `low_confidence` items and anything load-bearing before relying
# on it in a real transaction.

as_of: '2026-07-27'
entities:
- key: chips-po
  name: CHIPS Program Office (CPO), National Institute of Standards and Technology, U.S. Department
    of Commerce
  short: CHIPS Program Office
  group: commerce
  principal:
    name: Bill Frauenhofer
    title: Director, CHIPS Program Office
    status: confirmed
    as_of: 2025-07
  working_level: 'Lynelle McKay, Chief Portfolio Management Officer, CHIPS Program Office
    (appointed July 2024; continuation into 2026 not re-verified). Note: Michael Grimes ran
    the umbrella U.S. Investment Accelerator until his departure in January 2026, after which
    Secretary Howard Lutnick assumed direct control of the Accelerator.'
  situated: Housed within NIST at the Department of Commerce and, since a March 31, 2025 executive
    order, administered under the U.S. Investment Accelerator at Commerce; the Director is
    a non-Senate-confirmed appointee answering to the Secretary of Commerce (Howard Lutnick),
    and the office is funded by CHIPS Act of 2022 appropriations (P.L. 117-167) that are available
    until expended rather than by annual appropriations.
  firepower:
  - instrument: Direct funding awards (grants/cooperative agreements)
    what: Incentive awards for construction, expansion, or modernization of U.S. semiconductor
      fabrication, packaging, and materials/equipment facilities under Sec. 9902 (15 U.S.C.
      4652)
    capacity: $39 billion appropriated for manufacturing incentives; roughly $33.7 billion
      in direct-funding awards signed with ~20 companies as of January 2025 (Commerce OIG
      status report), leaving limited unobligated grant headroom that the current administration
      is renegotiating
  - instrument: Direct loans and loan guarantees
    what: CHIPS Act authority to make or guarantee loans to covered semiconductor projects
    capacity: Up to $75 billion in direct loan/loan-guarantee principal authorized; only a
      small fraction committed (e.g., up to $5 billion in proposed loans in the TSMC package),
      so this authority remains largely untapped as of 2025-2026
  - instrument: Equity stakes (via U.S. Investment Accelerator)
    what: Conversion of CHIPS grant obligations into government equity ownership in award
      recipients
    capacity: $8.9 billion converted into a ~9.9-10% common-stock stake in Intel (433.3 million
      shares at $20.47), closed August 2025, funded from $5.7B in undisbursed CHIPS grants
      plus $3.2B of Secure Enclave funds; the Accelerator also houses U.S. stakes in rare-earth
      companies and the government's US Steel board seat
  - instrument: CHIPS R&D programs (adjacent, run by CHIPS R&D Office)
    what: Funding for the National Semiconductor Technology Center, advanced packaging, and
      metrology programs adjacent to the incentives program
    capacity: $11 billion of the $52.7 billion CHIPS Act total is for R&D (administered by
      the separate CHIPS R&D Office within NIST)
  track_record: 'Under the prior administration the office moved from zero to roughly $33.7
    billion in signed, binding awards with about 20 companies in under two years, including
    finalized packages for Intel ($7.86B), TSMC ($6.6B), Micron ($6.1B+), Samsung ($4.745B),
    GlobalFoundries, TI, and a tail of supplier awards (Hemlock, Corning, Edwards Vacuum,
    Infinera, HP) closed in January 2025. In 2025-2026 the Trump administration shifted the
    model: Secretary Lutnick testified (June 2025) that direct grants should be roughly 4%
    or less of project value, deals were renegotiated, and in August 2025 Intel''s remaining
    grants were converted into an $8.9 billion, ~10% equity stake — the signature transaction
    of the new approach. As of mid-2026 no awards had been publicly rescinded; TSMC''s Arizona
    fabs entered volume production and Phase 2 tool-in was scheduled for Q3 2026.'
  mandate: 'Implements the CHIPS incentives program under Section 9902 of the FY2021 NDAA
    (15 U.S.C. 4652), as funded by the CHIPS Act of 2022: provide federal financial assistance
    (grants, loans, loan guarantees) to incentivize construction, expansion, and modernization
    of semiconductor fabrication, assembly, testing, advanced packaging, and materials/equipment
    facilities located in the United States.'
  cants: Statutory guardrails bar recipients from materially expanding semiconductor manufacturing
    capacity in foreign countries of concern (e.g., China, Russia) for 10 years and from using
    award funds for stock buybacks or dividends, with clawback provisions; funds may go only
    to 'covered entities' for U.S.-located semiconductor facilities, and awards over $150
    million carry upside-sharing requirements. The office cannot fund overseas projects and
    has no authority beyond the semiconductor purposes in statute.
  wants: '2025-2026 priorities per Lutnick testimony and the Investment Accelerator EO: renegotiate
    ''overly generous'' Biden-era awards to hold direct grants to roughly 4% or less of project
    value, take equity or other upside for taxpayers in exchange for CHIPS money, and use
    the Investment Accelerator to fast-track private investments exceeding $1 billion (paired
    with tariff pressure to induce fab reshoring).'
  reauth_or_risk: 'No appropriations cliff (CHIPS funds are available until expended), but
    material restructuring risk: the office was folded under the U.S. Investment Accelerator
    by executive order on March 31, 2025; President Trump publicly urged Congress to scrap
    the CHIPS Act in his March 2025 joint address (no repeal advanced); and Accelerator leadership
    churned when Michael Grimes departed in January 2026, with Secretary Lutnick taking direct
    control.'
  usia_angle: 'Our in-house grant program, distinct from the sovereign pool. Pair CHIPS grants
    with the 48D tax credit in semis packages, and treat award renegotiations as where our
    equity-position precedents get set — every term becomes the template for how we structure
    sovereign-pool investments too. Watch: milestone compliance is our own report card, and
    we''re simultaneously asking this office for staff.'
  matrix:
    runs: Bill Frauenhofer
    firepower: $39B grants (~$34B awarded); $75B loan authority, barely used; equity conversions
      (Intel ~10%)
    done: '$33.7B signed awards (~20 cos.: Intel, TSMC, Micron, Samsung…); 2025 pivot — Intel
      grants became $8.9B equity stake'
    must_cant: Fund U.S. semiconductor facilities / recipients barred from China expansion;
      semis only, U.S. only
    wants: Hold grants to ≤~4% of project value; take equity/upside for taxpayers
    usia: In-house grants; renegotiations set our equity precedents
  sources:
  - https://www.nist.gov/news-events/news/2025/07/us-department-commerce-appoints-bill-frauenhofer-director-chips-program
  - https://www.oig.doc.gov/wp-content/OIGPublications/OIG-25-021-I.pdf
  - https://newsroom.intel.com/corporate/intel-and-trump-administration-reach-historic-agreement
  - https://www.manufacturingdive.com/news/us-government-10-percent-stake-intel-chips-funding-8-9-billion/758518/
  - https://www.semafor.com/article/01/29/2026/longtime-elon-musk-banker-michael-grimes-leaves-commerce-department-to-go-back-to-silicon-valley
  low_confidence:
  - Frauenhofer's appointment (July 2025) is well sourced, but no July-2026 source explicitly
    re-confirms he remains Director; no departure has been reported.
  - Lynelle McKay's continued service as Chief Portfolio Management Officer in 2026 is unverified
    (appointment sourced to July 2024).
  - Exact remaining unobligated grant capacity within the $39B after renegotiations and the
    Intel equity conversion could not be verified to a current figure.
  - The 'up to $5 billion in loans' figure for TSMC and the near-untapped status of the $75B
    loan authority are from stored knowledge/secondary trackers, not a 2026 official source.
- key: eda
  name: Economic Development Administration (EDA), U.S. Department of Commerce
  short: EDA
  group: commerce
  principal:
    name: Ben Page
    title: Deputy Assistant Secretary for Economic Development and Chief Operating Officer,
      performing the non-exclusive functions and duties of the Assistant Secretary of Commerce
      for Economic Development
    status: acting
    as_of: 2026-04
  working_level: null
  situated: A bureau of the Department of Commerce statutorily led by an Assistant Secretary
    for Economic Development — a Senate-confirmed position that is vacant as of mid-2026,
    with Deputy Assistant Secretary/COO Ben Page performing the duties and reporting to the
    Secretary of Commerce; funded through annual Commerce-Justice-Science discretionary appropriations
    plus periodic disaster supplementals.
  firepower:
  - instrument: Public Works and Economic Adjustment Assistance (EAA) grants
    what: Construction, infrastructure, planning, and technical-assistance grants to economically
      distressed communities
    capacity: Regular annual EDA appropriations have run in the roughly $400-500 million range
      in recent years; the FY2026 President's Budget proposed zero (elimination)
  - instrument: Disaster Supplemental (EAA disaster funding)
    what: Economic-recovery and flood-mitigation grants for areas with 2023-2024 presidential
      major disaster declarations, deployed via three FY2025 funding 'pathways'
    capacity: $1.51 billion provided by P.L. 118-158 (American Relief Act, December 2024);
      being awarded through 2025-2026
  - instrument: Regional Technology and Innovation Hubs (Tech Hubs)
    what: Consortium-based awards to build regional technology clusters, authorized by the
      CHIPS and Science Act
    capacity: $10 billion authorized FY2023-FY2027 but only ~$541 million appropriated; ~$504M
      in Phase 2 implementation awards to 12 hubs (July 2024) plus ~$210M to 6 additional
      hubs (January 2025)
  - instrument: Distressed Area Recompete Pilot Program
    what: Grants targeting areas with large prime-age employment gaps
    capacity: ~$200 million appropriated (of $1B authorized); FY2026 budget proposed eliminating
      it
  - instrument: Build to Scale, University Centers, Partnership Planning, Revolving Loan Funds
    what: Smaller innovation/capacity grants and a legacy portfolio of locally administered
      revolving business-loan funds
    capacity: null
  track_record: EDA historically makes hundreds of grants a year at modest ticket sizes, but
    scaled up sharply after 2021, deploying a $3 billion ARPA portfolio (including the $1B
    Build Back Better Regional Challenge and $500M Good Jobs Challenge) and roughly $700M+
    in Tech Hubs awards across 2024-January 2025. In 2025-2026 its main activity has been
    standing up and awarding the $1.51B disaster supplemental via three funding pathways and
    completing a congressionally approved bureau-wide reorganization (announced April 2026)
    that consolidated operations into an Office of Regional Operations, an Office of Innovation
    and Entrepreneurship, and a new Office of Disaster Recovery and Resilience. Ben Page testified
    before House Transportation & Infrastructure in January 2026 on the agency's modernization.
  mandate: Under the Public Works and Economic Development Act of 1965 (42 U.S.C. 3121 et
    seq.), as comprehensively reauthorized by the Economic Development Reauthorization Act
    of 2024 (P.L. 118-272), EDA must provide grants and technical assistance to economically
    distressed communities to generate employment and stimulate private investment, and serves
    as a lead federal agency for economic recovery coordination after disasters; EDRA established
    five statutory investment priorities and directed attention to small, rural, under-resourced,
    and tribal communities.
  cants: EDA generally cannot grant directly to for-profit businesses — eligible recipients
    are state and local governments, tribes, economic development districts, universities,
    and nonprofits — and most programs require applicants to meet statutory economic-distress
    criteria and provide non-federal cost share. Its authorization of appropriations runs
    through FY2029 under EDRA 2024.
  wants: 'Agency leadership''s stated 2025-2026 priorities (Page testimony, January 2026;
    April 2026 modernization update) are operational streamlining — fewer management layers,
    two program offices, faster grant processing — plus rapid deployment of the $1.51B disaster
    supplemental and implementation of EDRA 2024. The administration''s own stated preference,
    however, is winding the bureau down: the FY2026 and FY2027 budget requests propose eliminating
    EDA on federalism grounds.'
  reauth_or_risk: 'Sharp tension between statute and budget: EDRA 2024 (P.L. 118-272, enacted
    January 2025 as part of the WRDA package) reauthorized EDA through FY2029 — its first
    reauthorization in about two decades — while the President''s FY2026 and FY2027 discretionary
    requests propose eliminating the agency entirely; bipartisan Senate pushback (e.g., Alsobrooks
    and Cramer) opposes closure, and a major reorganization was completed in April 2026. Outcome
    depends on annual appropriations.'
  usia_angle: 'Complement, not co-investor: workforce, infrastructure, and ecosystem money
    around a megasite — and the referral home for sub-$1B inbound that doesn''t meet our bar,
    so nothing credible leaves empty-handed.'
  matrix:
    runs: Ben Page (acting)
    firepower: 'Grants: public works (~$450M/yr), $1.5B disaster supplemental, Tech Hubs (~$541M
      appropriated)'
    done: Hundreds of grants/yr at modest size; deployed $3B ARPA portfolio incl. $1B regional
      challenge
    must_cant: Distressed-area economic development / generally can't fund for-profits directly;
      not deal-scale
    wants: Operational streamlining; workforce & critical-industry ecosystems; surviving its
      own budget fight
    usia: Site/workforce complement; referral home for sub-$1B
  sources:
  - https://www.eda.gov/about/leadership
  - https://www.eda.gov/news/blog/2026/04/02/eda-update-operational-modernization
  - https://www.congress.gov/crs-product/R48516
  - https://www.congress.gov/crs-product/R46991
  - https://www.congress.gov/crs-product/IN12633
  low_confidence:
  - Ben Page's exact current title wording is drawn from search snippets of eda.gov and his
    January 2026 House testimony; the eda.gov leadership page itself could not be fetched
    directly (403).
  - The 'roughly $400-500 million' recent regular annual appropriation range is an approximation
    from stored knowledge; exact FY2025 enacted level not verified.
  - Tech Hubs award figures (~$504M to 12 hubs, ~$210M to 6 hubs) and Recompete ~$200M are
    from stored knowledge consistent with CRS titles found, but not re-verified against a
    2026 document.
  - Whether any Assistant Secretary nominee for Economic Development is pending before the
    Senate as of July 2026 could not be determined.
- key: ita-selectusa
  name: International Trade Administration (ITA) / SelectUSA, U.S. Department of Commerce
  short: ITA / SelectUSA
  group: commerce
  principal:
    name: William (Will) Kimmitt
    title: Under Secretary of Commerce for International Trade
    status: confirmed
    as_of: 2026-05
  working_level: Ashok Pinto, Executive Director of SelectUSA (named spring 2025; has also
    performed the duties of Assistant Secretary for Global Markets and Director General of
    the U.S. and Foreign Commercial Service). Kelly Coldiron appears as SelectUSA Acting Executive
    Director in some 2026 Summit communications — which of the two currently holds the ED
    role as of July 2026 is not cleanly verifiable.
  situated: ITA is a bureau of the Department of Commerce headed by the Senate-confirmed Under
    Secretary for International Trade (Kimmitt, confirmed 51-47 on July 29, 2025, sworn in
    August 7, 2025), who reports to Secretary of Commerce Howard Lutnick; SelectUSA is the
    federal investment-promotion program housed in ITA's Global Markets unit, and the bureau
    is funded by annual discretionary appropriations supplemented by user fees for some trade
    services.
  firepower:
  - instrument: SelectUSA investor facilitation services
    what: Free, geographically neutral counseling, federal-regulatory ombudsman services,
      and matchmaking between foreign investors and U.S. state/local economic development
      organizations — no money changes hands
    capacity: Services-based, not a funding program; has facilitated $135+ billion in cumulative
      U.S. investment projects supporting 105,000+ jobs since 2011 (as of 2025)
  - instrument: SelectUSA Investment Summit
    what: Annual flagship FDI-attraction event convening investors from 100+ markets with
      U.S. economic developers
    capacity: 2026 Summit (May 3-6, National Harbor, MD) catalyzed over $56 billion in investment
      commitments and plans with 5,500+ attendees; 2027 Summit set for May 2-5, 2027
  - instrument: U.S. and Foreign Commercial Service / Advocacy Center / trade missions
    what: Export promotion, commercial diplomacy in ~80 international markets, and government-to-government
      advocacy for U.S. bidders on foreign procurements
    capacity: Funded within ITA's annual appropriation (roughly $600M-range bureau budget
      in recent years); no lending or grant capacity
  - instrument: Enforcement and Compliance (AD/CVD)
    what: Administers antidumping and countervailing duty law and monitors trade-agreement
      compliance — regulatory leverage rather than capital
    capacity: null
  track_record: SelectUSA's cumulative facilitation stands at $135+ billion in investment
    projects and 105,000+ jobs since 2011. The May 2025 Summit was the largest in its history
    (5,500+ attendees, 100+ markets, 1,100+ economic developers); the May 2026 Summit matched
    that scale and reported over $56 billion in investment commitments and plans, including
    $1.1 billion announced by Indian companies. Under Kimmitt (sworn in August 2025), ITA
    has run the Summit machinery on schedule, announced the 2027 Summit, and continued AD/CVD
    enforcement supporting the administration's tariff-forward trade agenda.
  mandate: ITA (established 1980 under Reorganization Plan No. 3 of 1979) must strengthen
    the competitiveness of U.S. industry, promote trade and inbound investment, and ensure
    fair trade through enforcement of antidumping/countervailing duty laws and trade-agreement
    compliance. SelectUSA, created by Executive Order 13577 (June 2011), must coordinate federal
    FDI-attraction activity and serve as a single federal point of contact and ombudsman for
    investors.
  cants: SelectUSA must remain geographically neutral among U.S. states and territories and
    provides no financial incentives — grants, tax breaks, and site inducements come only
    from state and local governments; ITA more broadly has no grant or loan authority for
    investors. AD/CVD determinations are bound by the statutory standards of Title VII of
    the Tariff Act of 1930 and cannot be issued at policy discretion.
  wants: '2025-2026 priorities per Commerce press materials and Kimmitt''s public role: maximize
    inbound FDI as the complement to the administration''s tariff/reshoring agenda (''invest
    in America to sell in America''), grow the Summit pipeline (record 2026 attendance, $56B
    in commitments, 2027 Summit announced), and aggressively enforce trade-remedy laws to
    defend U.S. industry.'
  reauth_or_risk: No reauthorization cliff for ITA itself (annual appropriations); the structural
    soft spot is that SelectUSA rests on Executive Order 13577 and annual appropriations rather
    than a permanent statutory charter — periodic codification bills have not been enacted
    as far as could be verified.
  usia_angle: 'Our origination funnel: inbound FDI leads and the state-incentive channel.
    Keep a named liaison so a SelectUSA lead reaches our screening within days, not quarters.
    Also Kroon''s home agency — a warm bridge.'
  matrix:
    runs: William (Will) Kimmitt
    firepower: No money — FDI facilitation, state network, Commercial Service, annual Investment
      Summit
    done: '$135B+ cumulative facilitated FDI since 2011; 2026 Summit: $56B in commitments'
    must_cant: Promote trade & inbound investment / state-neutral; has no incentives of its
      own to offer
    wants: Maximize inbound FDI as the complement to the tariff/reshoring agenda
    usia: FDI origination funnel + state channel
  sources:
  - https://www.trade.gov/press-release/2026-selectusa-investment-summit-concludes-catalyzing-over-56-billion-investment
  - https://www.trade.gov/press-release/william-kimmitt-sworn-under-secretary-commerce-international-trade
  - https://www.congress.gov/nomination/119th-congress/22/13
  - https://www.govtrack.us/congress/votes/119-2025/s443
  - https://www.commerce.gov/news/press-releases/2025/05/record-breaking-11th-selectusa-investment-summit-concludes
  low_confidence:
  - 'Current SelectUSA Executive Director as of July 2026 is ambiguous: Ashok Pinto was named
    ED in spring 2025, but Kelly Coldiron appears as ''Acting Executive Director'' in some
    2026 Summit promotional material; sequencing could not be resolved from available sources.'
  - The ITA bureau budget characterization ('roughly $600M-range') is from stored knowledge,
    not a verified FY2025/FY2026 enacted figure.
  - Dollar results attributed to the 2025 Summit itself were inconsistently reported (one
    summary cited 'over $1 billion' announced at the event vs. the $56B commitments figure
    at the 2026 Summit); the 2025 event-specific investment total was not independently verified.
  - The claim that no SelectUSA codification bill has been enacted is based on absence of
    evidence in searches, not a definitive legislative-history check.
  - 'Verifier (capacity): corrected — The $135+ billion / 105,000+ jobs figure is the SelectUSA
    Investment Summit-specific statistic (investment generated via the annual Summit since
    2011), not the program''s overall investor-facilitation total. Program-wide, Commerce
    announced in January 2024 that SelectUSA had facilitated more than $200 billion in client-verified
    FDI supporting more than 200,000 U.S. jobs, and trade.gov''s current About SelectUSA page
    cites more than $400 billion facilitated, creating and/or retaining over 270,000 U.S.
    jobs. The claim materially understates (and mislabels) SelectUSA''s cumulative facilitation.'
- key: dod-osc
  name: Office of Strategic Capital (OSC), U.S. Department of Defense (currently styled Department
    of War)
  short: DoD OSC
  group: dod
  principal:
    name: David A. Lorch
    title: Director, Office of Strategic Capital, and Senior Advisor to the Deputy Secretary
      of War
    status: confirmed
    as_of: 2026-06
  working_level: null
  situated: An OSD office codified at 10 U.S.C. 149 by the FY2024 NDAA (P.L. 118-31); its
    director is appointed by the Secretary of Defense (not Senate-confirmed) and, following
    a 2025 reorganization, reports to the Under Secretary of Defense for Research and Engineering
    (Emil Michael), with funding coming from defense appropriations credit-subsidy accounts
    (FY2024 appropriations supporting $984M in loans; $500M mandatory credit subsidy from
    the July 2025 One Big Beautiful Bill Act).
  firepower:
  - instrument: Direct loans (covered-technology equipment financing)
    what: Direct loans for equipment/capital assets in 30+ statutorily defined covered technology
      categories under the 10 U.S.C. 149-note pilot program
    capacity: Initial $984M tranche (NOFA Sept 2024); superseded in scale by P.L. 119-21
  - instrument: Critical-minerals direct loans (OBBBA-funded)
    what: Direct lending for critical minerals production and related industries funded by
      OBBBA mandatory appropriations
    capacity: $500M credit subsidy supporting up to $100B in critical-minerals loans (P.L.
      119-21 sec. 20004, July 2025); FY2026 appropriations added ~$97.8M subsidy (~$4.4B volume);
      total OSC lending capacity >$210B per Director Lorch
  - instrument: Loan guarantees and technical assistance
    what: Authorized alongside direct loans under the FY2024 NDAA pilot (capital assistance
      to eligible entities such as corporations and joint ventures), subject to availability
      of appropriations
    capacity: null
  track_record: 'OSC closed its first direct loan in August 2025: $150 million to MP Materials
    to add heavy rare-earth separation capability at Mountain Pass, CA, roughly seven months
    after its first funding notice opened in January 2025. It has since signed large conditional
    loan commitments concentrated in the rare-earth/critical-minerals supply chain: ~$700
    million to Vulcan Elements ($620M) and ReElement Technologies ($80M) as part of a $1.4
    billion public-private magnet supply-chain package (Nov 2025), $500 million to Phoenix
    Tailings for its ''Freedom Facility'' rare-earth midstream plant (June 16, 2026), and
    $725 million to Energy Fuels for White Mesa Mill expansion and a rare-earth metals/alloy
    facility (June 18, 2026). Committed/announced volume is therefore in the low single-digit
    billions, with only the MP loan fully closed among the publicly confirmed transactions
    as of mid-2026.'
  mandate: 'Statutory purpose under 10 U.S.C. 149 and the FY2024 NDAA pilot: attract and scale
    private capital for national-security-critical technologies and supply chains by providing
    capital assistance (loans, loan guarantees, technical assistance) for dual-use technologies
    within covered technology categories defined in statute (e.g., advanced manufacturing,
    quantum sensing, space launch, critical minerals processing).'
  cants: OSC cannot make grants or (under its own pilot authority) take equity — it is a credit
    program limited to loans, loan guarantees, and technical assistance for eligible entities
    in the statutory covered-technology categories, subject to Federal Credit Reform Act budgeting
    and available credit-subsidy appropriations. Its pilot program authority expires October
    1, 2028, and lending is capped by appropriated subsidy (originally $984M capacity; OBBBA
    capacity is restricted to critical minerals production and related industries).
  wants: 2025-2026 priorities center on rebuilding the domestic critical-minerals and rare-earth
    'mine-to-magnet' supply chain. P.L. 119-21 (July 2025) made OSC a ~$200 billion lender;
    leadership targets loans of $1-5 billion, and the FY2027 budget request seeks more than
    $20 billion in additional loan volume.
  reauth_or_risk: Pilot program authority under the FY2024 NDAA expires October 1, 2028; capacity
    depends on credit-subsidy appropriations. CRS (May 2026) flagged no FY2026 investment
    strategy released as of May 1, 2026, and Congress is weighing added reporting/transparency
    requirements. The ~$200 billion scaling WAS enacted in July 2025 (P.L. 119-21).
  usia_angle: 'The scaled co-lender: ~$200B+ in lending authority (2025) aimed at exactly
    our sectors — dual-use tech and critical minerals — targeting $1-5B checks. Bring them
    in early, share credit publicly, and pair OSC debt with sovereign-pool equity and CHIPS/DPA
    grants for full stacks.'
  matrix:
    runs: David A. Lorch
    firepower: $200B+ loan authority (P.L. 119-21) incl. $100B critical minerals; targets
      $1–5B loans
    done: First loan Aug 2025 ($150M MP Materials); ~$2B conditional commitments across rare-earth
      chain
    must_cant: Credit for defense-critical tech & minerals / no grants, no equity; pilot sunsets
      Oct 2028
    wants: Mine-to-magnet lending at $1–5B checks; prove out the new $200B authority
    usia: Scaled co-lender — pair their $200B debt authority with our equity
  sources:
  - https://www.congress.gov/crs-product/IF13215
  - https://www.war.gov/News/Releases/Release/Article/4270722/office-of-strategic-capital-announces-first-loan-through-dod-agreement-with-mp/
  - https://www.war.gov/News/Releases/Release/Article/4517853/office-of-strategic-capital-signs-500-million-conditional-loan-commitment-with/
  - https://www.war.gov/News/Releases/Release/Article/4520819/the-department-of-wars-office-of-strategic-capital-signs-725-million-conditiona/
  - https://www.cto.mil/osc/
  low_confidence:
  - Exact date David A. Lorch became OSC Director and whether his appointment carries any
    'acting' qualifier — he is quoted as 'Director' in June 2026 official releases, but no
    formal appointment announcement was located; Patrick Witt was Acting Director as of Aug
    2025
  - Identity of OSC's deputy director / operational deputy — no public listing verified
  - OSC's FY2026 appropriation level — DefenseScoop reported the program was 'allotted less
    than $1.5 billion for fiscal 2026,' not independently verified against budget documents
  - Exact count of statutory covered technology categories (CRS versions cite ~31-34; May
    2026 CRS summary says 34)
  - Loan size limits in the initial $984M NOFA (reported elsewhere as $10M-$150M per loan)
    — not re-verified
- key: dpa-title-iii
  name: Defense Production Act Title III program (DoD Defense Production Act Investments /
    DPA Purchases), Office of the Assistant Secretary of Defense for Industrial Base Policy
  short: DPA Title III
  group: dod
  principal:
    name: Michael P. Cadenazzi Jr.
    title: Assistant Secretary of Defense (War) for Industrial Base Policy
    status: confirmed
    as_of: 2026-07
  working_level: Jeffrey Frankston, Acting Deputy Assistant Secretary of War for Industrial
    Base Resilience (oversees the Manufacturing Capability Expansion & Investment Prioritization
    directorate, which runs the DPA Purchases/DPA Investments office), per Feb 2026 DoW release
  situated: Sits within the Office of the Under Secretary of Defense (War) for Acquisition
    and Sustainment under the Senate-confirmed Assistant Secretary for Industrial Base Policy
    (Cadenazzi, confirmed 52-47, sworn in Sept 23, 2025); it executes presidential DPA authorities
    delegated to DoD and is funded through the annual Defense Production Act Purchases appropriation
    plus mandatory reconciliation (OBBBA) funds.
  firepower:
  - instrument: Purchases, purchase commitments, grants/other financial assistance (DPA sec.
      303)
    what: Direct investments to create, maintain, or expand domestic productive capacity for
      essential materials and technologies
    capacity: 'FY2026 request: $265.9 million for DPA Purchases ($236.9M discretionary + $29.0M
      mandatory reconciliation for strategic/critical minerals)'
  - instrument: OBBBA critical-minerals investments (Industrial Base Fund via DPA Title III)
    what: Mining, processing, refining, and supply-chain integration projects executed primarily
      through Title III authorities and the Defense Industrial Base Consortium OTA
    capacity: $5 billion appropriated by P.L. 119-21 sec. 20004 (July 2025), part of $7.5
      billion total OBBBA critical-minerals funding to DoD
  - instrument: Loans and loan guarantees (DPA secs. 301-302)
    what: Authorized but rarely used financing tools; government-wide only one Title III loan
      (a $410M loan in 2023 for vaccine/critical-medicine manufacturing capacity) in FY2018-2024
    capacity: null
  - instrument: Equity-style investment (Title III authority)
    what: Purchase of preferred stock — used for the July 2025 MP Materials transaction making
      DoD the company's largest shareholder
    capacity: $400 million (July 2025)
  track_record: 'GAO found that in FY2018-2024, Title III was used by DoD, HHS, and DOE for
    222 investments plus one loan totaling $3.6 billion, with DoD making 208 of those investments
    (COVID response and strategic/critical materials). In 2025-2026 DoD''s marquee Title III
    action was the July 2025 MP Materials package ($400M preferred-equity purchase, paired
    with a $150M OSC loan), followed by a steady cadence of smaller awards: ~$27M for U.S.
    antimony production, $11.8M for domestic critical-materials processing (Feb 2026), $27.3
    million to PacSci EMC (Apr 2026) and $32.7 million to Systima Technologies and R.E. Darling
    for solid rocket motor capacity, plus a March 2026 Defense Industrial Base Consortium
    request for proposals beginning execution of the $5 billion OBBBA critical-minerals fund.
    Typical individual awards run $10M-$100M+ and take months from solicitation to award.'
  mandate: Title III of the Defense Production Act of 1950 (50 U.S.C. 4531-4534) directs incentives
    — loans, loan guarantees, purchases, purchase commitments, and other financial assistance
    — to create, maintain, protect, expand, or restore domestic industrial base capabilities
    essential for national defense, funded through the DPA Fund.
  cants: Title III actions require a nondelegable presidential determination that the resource
    is essential, industry cannot supply it timely without action, and the action is the most
    cost-effective alternative; if actions under one determination exceed $50 million in aggregate,
    prior congressional authorization and a 30-day committee notification are required (waivable
    during declared national emergencies). Assistance is limited to 'domestic sources' — businesses
    performing substantially all relevant work in the United States or Canada, with the United
    Kingdom and Australia added for Title III purposes — and the underlying DPA authorities
    currently expire September 30, 2026.
  wants: '2025-2026 priorities per budget documents, leadership statements (ASD Cadenazzi),
    and award flow: executing the $5 billion OBBBA critical-minerals mandate (mine-to-magnet
    rare earths, antimony, gallium, battery materials), expanding solid rocket motor and munitions/energetics
    capacity, and reducing reliance on Chinese supply chains across the defense industrial
    base.'
  reauth_or_risk: DPA authorities lapsed October-November 2025 after expiring September 30,
    2025 (delaying transactions), were extended to January 30, 2026 by P.L. 119-37, then to
    September 30, 2026 by the FY2026 NDAA (P.L. 119-60) — a multiyear reauthorization remains
    pending before Congress, so authorities again face a September 30, 2026 cliff.
  usia_angle: Fastest discretionary grant path when a defense nexus exists; the presidential-determination
    route rewards exactly the White House alignment USIA can deliver. Our speed lever for
    critical-minerals gap-filling.
  matrix:
    runs: Michael P. Cadenazzi Jr.
    firepower: Purchases, purchase commitments, grants; $5B OBBBA minerals fund; $400M equity-style
      authority
    done: '222 investments / $3.6B FY18–24; 2025: $400M MP Materials equity stake, $5B minerals
      push'
    must_cant: Expand industrial-base capacity / needs presidential determination + defense
      nexus
    wants: Mine-to-magnet at speed; energetics and munitions supply chains
    usia: Speed lever where defense nexus exists
  sources:
  - https://www.congress.gov/crs-product/IN12484
  - https://www.congress.gov/crs-product/R43767
  - https://www.gao.gov/products/gao-25-108497
  - https://comptroller.war.gov/Portals/45/Documents/defbudget/FY2026/budget_justification/pdfs/02_Procurement/PROC_DPAP_PB_2026.pdf
  - https://www.csis.org/analysis/impacts-one-big-beautiful-act-mining-sector
  low_confidence:
  - Identity of the DPA Title III program office director below the DASD level — not publicly
    verified
  - Whether the Air Force Research Laboratory still serves as Title III executive agent for
    contracting (historically true; not re-verified for 2026, and many recent awards run through
    the Defense Industrial Base Consortium OTA)
  - Exact statutory authority mix used for the $400M MP Materials preferred-stock purchase
    — widely reported as DPA Title III but the transaction structure has not been fully disclosed
  - Jeffrey Frankston's acting status as of July 2026 (sourced from a Feb 2026 release snippet)
- key: ibas
  name: Industrial Base Analysis and Sustainment (IBAS) Program, Office of the Assistant Secretary
    of Defense for Industrial Base Policy
  short: IBAS
  group: dod
  principal:
    name: Dr. Kristin Schaaf
    title: Acting Director, Innovation Capability and Modernization (ICAM) Office and Acting
      Director, Industrial Base Analysis and Sustainment (IBAS) Program
    status: acting
    as_of: 2026-07
  working_level: null
  situated: A program (not an agency) run by the career-led ICAM office within the Deputy
    Assistant Secretary for Industrial Base Resilience organization, under the Senate-confirmed
    Assistant Secretary of Defense (War) for Industrial Base Policy in OUSD(A&S); its director
    is a career official requiring no Senate confirmation, and it is funded through the OSD
    RDT&E budget line PE 0607210D8Z (Industrial Base Analysis and Sustainment Support) drawing
    on Industrial Base Fund authority.
  firepower:
  - instrument: Grants, OTAs, and contracts (assistance listing 12.750)
    what: Direct project funding to establish, expand, or sustain defense-critical industrial
      capabilities and workforce, largely awarded through the Cornerstone OTA administered
      by Army Contracting Command-Rock Island
    capacity: 'FY2026 budget request: $2,328.4 million for PE 0607210D8Z (a large increase
      over prior-year levels in the hundreds of millions)'
  - instrument: National Imperative for Industrial Skills (workforce initiative)
    what: Industrial workforce/talent-pipeline projects in defense-critical trades
    capacity: ~$130 million across 16 workforce projects since 2020
  track_record: IBAS has funded hundreds of targeted industrial-base projects since 2014,
    with signature portfolios in castings and forgings, energetics and kinetic capabilities,
    hypersonics/solid rocket motors (e.g., X-Bow SRM capacity work), microelectronics, batteries,
    critical chemicals, and its National Imperative for Industrial Skills workforce initiative
    (~$130M across 16 projects since 2020). Individual awards typically run from single-digit
    to low-tens of millions and move through the Cornerstone/DIBC OTA vehicles faster than
    traditional procurement. Its budget line has grown sharply — the FY2026 request of roughly
    $2.3 billion reflects the administration's 2025-2026 critical-minerals and munitions industrial-base
    push.
  mandate: Funded through the Industrial Base Fund (10 U.S.C. 4817, formerly 2508), IBAS must
    monitor and assess the defense industrial base, address critical capability shortfalls
    and supply-chain vulnerabilities, and sustain or expand domestic industrial capabilities
    essential to national defense.
  cants: IBAS is not a lending or equity program — it provides grants, OTA agreements, and
    contracts only, and its investments must tie to demonstrated defense industrial base shortfalls;
    it depends entirely on annual RDT&E appropriations (no mandatory funding stream of its
    own and no revolving capital). Awards flow to the domestic (U.S.) industrial base; it
    has no statutory sunset but also no standing multi-year capital authority.
  wants: '2025-2026 priorities per program briefings and the FY2026 request: scaling critical-minerals
    and critical-chemicals supply chains, munitions/energetics and solid rocket motor capacity,
    drone/uncrewed-systems and advanced manufacturing capability, and industrial workforce
    development through the talent-pipeline programs.'
  reauth_or_risk: No statutory sunset or reauthorization requirement, but the program is wholly
    dependent on annual appropriations — the roughly $2.3 billion FY2026 request (a several-fold
    increase) was pending congressional action during 2025-2026, and the program was navigating
    a leadership transition after long-time director Adele Ratcliff's 2025 retirement (acting
    leadership as of mid-2026).
  usia_angle: Small-check gap filler — de-risks a package's weakest link without reopening
    the whole stack. Cheap to ask, fast to move.
  matrix:
    runs: Dr. Kristin Schaaf (acting)
    firepower: Grants/OTAs; FY26 request ~$2.3B — a big step-up from hundreds of millions
    done: 'Hundreds of targeted projects since 2014: castings/forgings, energetics, hypersonics,
      workforce'
    must_cant: Fix defense industrial-base gaps / grants only — no loans or equity; defense
      tie required
    wants: Critical minerals & chemicals, munitions, solid rocket motors
    usia: Small fast checks for package gaps
  sources:
  - https://www.businessdefense.gov/ibr/wire/ibas.html
  - https://www.businessdefense.gov/leadership/dr-kristin-schaaf.html
  - https://www.businessdefense.gov/ibr/mceip/icam/
  - https://www.highergov.com/budget/industrial-base-analysis-and-sustainment-support-b1edd7d/
  - https://nerdic.us/wp-content/uploads/2025/02/ICAM-101_NERDIC_9-Jan-25_Distro-A-Dr.-Kristin-Schaaf.pdf
  low_confidence:
  - FY2024 and FY2025 enacted funding levels for PE 0607210D8Z — not verified in this research
  - Composition of the $2,328.4M FY2026 request (whether it consolidates critical-minerals
    or other industrial-base funding into the IBAS line) — single non-.gov source (HigherGov)
  - Whether Dr. Schaaf remained acting IBAS/ICAM director in July 2026 or a permanent director
    was named after Adele Ratcliff's retirement
  - Whether the X-Bow solid rocket motor expansion was funded specifically by IBAS versus
    another industrial-base program
  - Identity of a deputy/second-in-command below Dr. Schaaf
- key: dla-nds
  name: Defense Logistics Agency — National Defense Stockpile (managed by DLA Strategic Materials)
  short: DLA / Stockpile
  group: dod
  principal:
    name: Lt. Gen. Mark T. Simerly (USA)
    title: Director, Defense Logistics Agency (National Defense Stockpile Manager is delegated
      to DLA)
    status: confirmed
    as_of: 2026-07
  working_level: Eric J. Mata, Administrator, DLA Strategic Materials (runs day-to-day NDS
    acquisition/storage/disposition)
  situated: 'Sits in the Department of Defense as a DoD combat support agency: DLA reports
    to the Under Secretary of Defense for Acquisition & Sustainment (stockpile policy via
    industrial base policy officials); the director is a three-star military officer (Senate-confirmed
    in rank, not a PAS civilian post); NDS operations are financed by the revolving National
    Defense Stockpile Transaction Fund (sales proceeds plus direct appropriations, most recently
    a $2B FY2025 appropriation in the One Big Beautiful Bill Act, Sec. 20004).'
  firepower:
  - instrument: NDS Transaction Fund purchases
    what: Direct government purchase and physical stockpiling of strategic and critical materials
    capacity: $2B appropriated by OBBBA (signed 2025-07-04) for critical-minerals acquisitions,
      on top of the existing revolving fund; DoD announced intent in 2025 to procure up to
      ~$1B of stockpile materials
  - instrument: Multi-year IDIQ offtake-style contracts
    what: Five-year indefinite-delivery contracts with domestic producers (e.g., up to $245M
      antimony IDIQ to United States Antimony Corp., Sept 2025; cobalt solicitation up to
      $500M; tantalum ~$100M; scandium ~$45M)
    capacity: Individual solicitations from ~$45M to $500M as of 2025-2026
  - instrument: Sales/rotations of excess materials
    what: Disposal of excess stockpile materials per the congressionally approved Annual Materials
      Plan
    capacity: Quantity-capped annually by the AMP; historically a revenue source, now de-emphasized
      in favor of accumulation
  track_record: Historically a Cold War legacy holder of a modest inventory (roughly $1-2B
    in materials) that mostly sold down excess for decades; since 2024-2025 it has pivoted
    sharply to buying. In 2025 DoD announced intent to procure up to $1B in stockpile materials,
    issued numerous RFIs (cobalt, bismuth, indium, niobium, scandium, tantalum, tungsten,
    graphite, samarium, dysprosium, terbium), awarded a five-year IDIQ worth up to $245M to
    United States Antimony Corp. (first $10M delivery order Sept 2025), and issued then withdrew
    (Oct 2025, for rework) an up-to-$500M high-purity cobalt solicitation. The OBBBA's $2B
    infusion (July 2025) is by far the largest stockpile funding in decades and purchases
    under it continued into 2026.
  mandate: Under the Strategic and Critical Materials Stock Piling Act (50 U.S.C. 98 et seq.),
    the NDS must acquire and retain strategic and critical materials to preclude a dangerous
    and costly dependence on foreign sources of supply in time of national emergency; DoD
    is the designated stockpile manager and DLA executes via an annual materials plan.
  cants: By statute the stockpile may be used only for national defense purposes and expressly
    may not be used for economic or budgetary purposes; releases require presidential/statutory
    direction, disposals require congressional (NDAA) authorization, annual acquisition/disposal
    quantities are capped by the congressionally reviewed Annual Materials Plan, and a Market
    Impact Committee (co-chaired by State and Commerce) must vet transactions to avoid undue
    market disruption.
  wants: '2025-2026 priorities: rapidly rebuild inventories of critical minerals exposed to
    Chinese export controls (antimony, gallium, germanium, rare earths, cobalt), obligate
    the OBBBA $2B through multi-year purchase contracts that double as demand signals for
    domestic producers, and expand coverage to materials with U.S. deposits but weak domestic
    processing (scandium, tungsten, graphite).'
  reauth_or_risk: No charter expiration, but acquisitions/disposals depend on annual NDAA/AMP
    authorizations; leadership transition pending — Lt. Gen. Simerly retires December 2026
    and Maj. Gen. (promotable) David Sanford was announced in June 2026 as his replacement;
    execution risk noted in 2025-2026 reporting (e.g., canceled/reworked cobalt solicitation).
  usia_angle: The offtake/price-floor lever. Demand certainty replaces billions in subsidy
    for commodity-exposed minerals deals — bring DLA a standardized floor structure instead
    of negotiating bespoke each time.
  matrix:
    runs: Lt. Gen. Mark T. Simerly (USA)
    firepower: 'Stockpile purchases: $2B OBBBA minerals fund; IDIQ offtake-style contracts
      ($45M–$500M)'
    done: 'Pivoted 2024–25 from selling down to buying hard: antimony, gallium, germanium,
      rare earths, cobalt'
    must_cant: Hold strategic materials for defense / defense purposes only; releases tightly
      restricted
    wants: Rebuild inventories exposed to Chinese export controls; obligate the $2B fast
    usia: Offtake/price floors — demand certainty > subsidy
  sources:
  - https://www.dla.mil/About-DLA/Leaders/Biographies/Details/Article/3663915/ltg-us-army-mark-t-simerly/
  - https://www.dla.mil/About-DLA/Leaders/Biographies/Details/Article/2708977/mr-eric-j-mata/
  - https://www.insidegovernmentcontracts.com/2026/02/federal-push-for-critical-minerals-stockpiling-2025-in-review-and-outlook-for-2026/
  - https://www.csis.org/analysis/impacts-one-big-beautiful-act-mining-sector
  - https://www.congress.gov/crs-product/R47833
  low_confidence:
  - Exact period of availability of the OBBBA $2B NDS appropriation (FY2025 appropriation;
    whether it remains available through FY2029 like the companion $5B Industrial Base Fund
    money was not directly verified)
  - Current NDS Transaction Fund balance and total inventory value as of mid-2026
  - Whether the withdrawn $500M cobalt solicitation had been reissued as of July 2026
  - Eric Mata's continued tenure as Administrator as of July 2026 (DLA bio page and a July
    2026 trade-press article support it, but no leadership-change search was run specifically)
- key: doe-lpo
  name: U.S. Department of Energy Office of Energy Dominance Financing (EDF; formerly the
    Loan Programs Office)
  short: DOE LPO
  group: doe
  principal:
    name: Gregory (Greg) A. Beard
    title: Director, Office of Energy Dominance Financing (effective Jan 29, 2026)
    status: confirmed
    as_of: 2026-02
  working_level: null
  situated: Sits inside the Department of Energy; its director is appointed by the Secretary
    of Energy (not Senate-confirmed) and reports up through DOE leadership to Secretary Chris
    Wright; lending capacity comes from statutory loan-guarantee/direct-loan authorities (Title
    XVII of EPAct 2005, ATVM, Tribal energy) with credit-subsidy costs covered by appropriations
    — most recently $1B for the Energy Dominance Financing program in the OBBBA — or borrower-paid
    fees.
  firepower:
  - instrument: Energy Dominance Financing program (Sec. 1706, rebranded EIR)
    what: Loan guarantees for projects that retool, repower, replace, or add capacity to energy
      infrastructure — expanded by OBBBA to cover coal/gas generation, nuclear, grid, and
      critical-minerals supply chains
    capacity: Up to $250B total principal through Sept 30, 2028, with $1B OBBBA credit subsidy
      (est. to support roughly $200B+ of financing); office-wide loan authority reported at
      ~$289B as of Feb 2026
  - instrument: Title 17 Sec. 1703 innovative energy loan guarantees
    what: Guarantees for projects deploying new or significantly improved energy technology
    capacity: Sharply reduced — OBBBA rescinded unobligated IRA credit-subsidy funding for
      the Title 17 clean-energy program (remaining capacity limited/uncertain as of mid-2026)
  - instrument: Advanced Technology Vehicles Manufacturing (ATVM) direct loans
    what: Direct loans for U.S. manufacturing of advanced vehicles and components
    capacity: Authority survives but OBBBA rescinded unobligated IRA credit subsidy; new-lending
      capacity limited as of 2025-2026
  - instrument: Tribal Energy Finance Program
    what: Partial loan guarantees/direct loans for energy development by tribes
    capacity: Authority retained; scale post-OBBBA not well documented publicly
  track_record: Since 2005 the office has closed tens of billions in loans (Tesla, Ford, the
    Vogtle nuclear guarantees, and a ~$100B wave of closings/conditional commitments in late
    2024). Under the second Trump administration it reviewed and pared back Biden-era commitments
    (canceling the $4.9B Grain Belt Express transmission guarantee in July 2025) while continuing
    disbursements on the ~$1.5B Palisades nuclear-restart loan across at least five tranches
    in 2025. In its EDF era it issued a conditional commitment of up to $17.5B in American
    Nuclear Supply Chain Loans (announced June 23, 2026) to finance long-lead equipment for
    up to 10 Westinghouse AP1000 reactors at five sites, plus an up-to-$263M conditional commitment
    to SHINE for a medical-isotope plant.
  mandate: Statutorily charged under Title XVII of the Energy Policy Act of 2005 (Secs. 1703
    and 1706 as amended by IRA and OBBBA), EISA Sec. 136 (ATVM), and tribal energy authorities
    to provide debt financing that commercial lenders will not, for energy infrastructure,
    innovative technology, and (post-OBBBA) energy-security and critical-minerals projects;
    every loan must have a reasonable prospect of repayment.
  cants: Cannot finance projects lacking a reasonable prospect of repayment; guaranteed debt
    is generally capped at 80% of project costs; Sec. 1703 is restricted to new-or-significantly-improved
    technologies; the EDF/Sec. 1706 commitment authority expires September 30, 2028; credit
    subsidy must be appropriated or paid by borrowers, and the OBBBA rescissions removed most
    IRA-era subsidy for the non-EDF windows.
  wants: '2025-2026 stated priorities (Secretary Wright, Director Beard): finance power capacity
    for the AI race and grid reliability, rebuild the commercial nuclear industry (AP1000
    fleet, restart projects), secure critical-minerals supply chains, and open eligibility
    to coal and oil-and-gas-fired generation under the ''energy dominance'' banner.'
  reauth_or_risk: EDF (Sec. 1706) commitment authority sunsets Sept 30, 2028; the October
    28, 2025 interim final rule implementing EDF drew GAO review (B-338008) and legal scrutiny;
    ongoing litigation/dispute risk from restructured or canceled Biden-era loans and conditional
    commitments; annual appropriations still needed for administrative expenses and any new
    credit subsidy.
  usia_angle: 'The senior-debt partner for energy, nuclear, and minerals-with-an-energy-nexus:
    LPO leverage stretches every sovereign-pool equity dollar and their underwriting is real
    diligence our deals benefit from. They are slow — engage at deal intake, not at structuring,
    and never promise LPO terms before LPO does. Also our best detailee bench — already producing
    people.'
  matrix:
    runs: Gregory (Greg) A. Beard
    firepower: 'Energy Dominance Financing: $250B authority through 2028; ATVM limited post-OBBBA'
    done: Tens of $B closed since 2005 (Tesla, Vogtle); ~$100B late-2024 wave; now nuclear,
      grid, AI power
    must_cant: Finance energy projects with repayment prospect / ≤80% of costs; energy nexus
      required
    wants: Power for AI, grid reliability, nuclear restart, minerals with an energy nexus
    usia: Senior debt that stretches our equity; engage at intake
  sources:
  - https://www.energy.gov/edf/articles/greg-beard-appointed-office-energy-dominance-financing-edf-director
  - https://www.cnbc.com/2026/02/22/the-worlds-largest-energy-lender-has-a-new-head-heres-how-it-could-shape-us-policy.html
  - https://www.federalregister.gov/documents/2025/10/28/2025-19675/energy-dominance-financing-amendments
  - https://www.energy.gov/articles/department-energy-announces-american-nuclear-supply-chain-loans
  - https://www.ans.org/news/2026-06-23/article-8142/doe-announces-175b-in-conditional-loans-for-ap1000-builds/
  low_confidence:
  - The ~$289B office-wide loan-authority figure (single press figure from Feb 2026 reporting;
    not verified against a DOE monthly portfolio report)
  - Precise remaining capacity of the 1703, ATVM, and Tribal windows after OBBBA rescissions
    (energy.gov pages returned 403 to fetch)
  - Identity/title of the current deputy or chief operating official under Beard (a Joshua
    Moraczewski appears on EDF staff pages but title unverified)
  - Exact completion date of the Palisades restart (disbursements verified through Aug 2025;
    widely reported restart in fall 2025 not independently re-verified here)
  - 'Leadership sequence detail: Lane Genatowski''s exact departure date between his mid-2025
    appointment and Beard''s Jan 29, 2026 start'
- key: doe-mesc
  name: DOE Office of Manufacturing & Energy Supply Chains (MESC) and Office of Clean Energy
    Demonstrations (OCED) — both absorbed into the Office of Critical Minerals and Energy
    Innovation (CMEI) in DOE's Nov 20, 2025 reorganization
  short: DOE MESC / OCED
  group: doe
  principal:
    name: Audrey Robertson
    title: Assistant Secretary of Energy leading the Office of Critical Minerals and Energy
      Innovation (Senate-confirmed Oct 7, 2025, 51-47, as Assistant Secretary for Energy Efficiency
      and Renewable Energy)
    status: confirmed
    as_of: 2026-01
  working_level: Christopher Saldaña, Deputy Assistant Secretary for Critical Minerals, Materials,
    and Manufacturing (CM3 pillar, which holds the former MESC portfolio); Michael Helmer
    is Principal Deputy Assistant Secretary of CMEI
  situated: Both were DOE program offices funded overwhelmingly by Bipartisan Infrastructure
    Law and IRA appropriations; as of the November 20, 2025 DOE reorganization their functions
    sit in CMEI (alongside former EERE technology offices and FECM minerals projects), led
    by a Senate-confirmed Assistant Secretary answering to Secretary of Energy Chris Wright.
  firepower:
  - instrument: BIL Sec. 40207 battery materials processing & battery manufacturing/recycling
      grants (ex-MESC)
    what: 50%-cost-share grants to build domestic battery-materials and cell/component manufacturing
    capacity: ~$6B appropriated; roughly $3B awarded in round 1 (Oct 2022) and up to ~$3B
      selected in round 2 (Sept 2024); ~$725M third round re-scoped in Jan 2025 toward critical-materials
      processing
  - instrument: OCED demonstration cooperative agreements
    what: At-scale, ~50% cost-share demonstrations (regional clean hydrogen hubs, industrial
      demonstrations, carbon capture and DAC hubs, long-duration storage)
    capacity: Originally $21.5B+ from BIL plus IRA industrial funds; gutted in 2025 — OCED
      accounted for roughly $12.4B of canceled awards across 61 projects, and FY2026 appropriations
      provided OCED nothing
  - instrument: Critical materials / manufacturing funding opportunities under CMEI
    what: Grants and cooperative agreements refocused on critical minerals processing, batteries,
      and magnets (e.g., 'Strengthening Domestic Critical Materials Processing and Manufacturing'
      NOI)
    capacity: Hundreds of millions per opportunity as of 2025-2026 (e.g., ~$725M NOI)
  track_record: MESC actually awarded roughly $3B in first-round battery grants (Oct 2022,
    ~20 firms) and selected up to ~$3B more in Sept 2024, plus IRA Defense Production Act
    heat-pump awards; in 2025 the office reopened funding refocused on critical-materials
    processing. OCED selected seven H2Hubs ($7B), ~33 industrial demonstration projects (~$6B),
    and DAC hubs, but in 2025 Secretary Wright terminated 24 awards worth $3.7B (May) and,
    on Oct 2, 2025, 321 awards across 223 projects worth $7.5B — with OCED bearing ~$12.4B
    in total cancellations including all hydrogen and DAC hubs. Both offices were then abolished
    as standalone organizations in the Nov 20, 2025 reorganization, with surviving programs
    moved into CMEI, which was split into three DAS-led pillars in January 2026.
  mandate: OCED was congressionally established by the 2021 Bipartisan Infrastructure Law
    with $21.5B+ to conduct at-scale demonstrations of emerging energy technologies; MESC
    was stood up administratively in 2022 to execute BIL/IRA manufacturing and supply-chain
    provisions (battery grants, industrial programs, supply-chain analysis). CMEI now carries
    the statutory obligations attached to those appropriated programs.
  cants: 'Grant programs are bound to their appropriated statutory purposes: battery grants
    require ~50% non-federal cost share and exclude foreign entities of concern, and demonstration
    awards carry EPAct 2005 Sec. 988 cost-share requirements; the executive cannot lawfully
    repurpose or withhold funds Congress appropriated to OCED-specific programs — the basis
    of ongoing impoundment/illegal-elimination claims by House Science Democrats and litigation
    by terminated awardees.'
  wants: '2025-2026 priorities under Robertson/CMEI: critical-minerals ''mine-to-magnet''
    supply chains, battery and magnet manufacturing, processing and metallurgy innovation,
    and recycling — reframed around energy dominance, affordability, and national security
    rather than decarbonization; demonstration spending is being steered toward nuclear, geothermal,
    and grid-supporting technologies.'

- key: exim
  name: Export-Import Bank of the United States (EXIM)
  short: EXIM
  group: independent
  principal:
    name: John Jovanovic
    title: President and Chairman of the Board of Directors
    status: confirmed
    as_of: 2026-06
  working_level: James G. Burrows, Acting First Vice President and Vice Chairman of the Board
    (appointed in an acting capacity by the President in March 2025; a career EXIM small-business
    banking executive)
  situated: Independent executive-branch agency serving as the official U.S. export credit
    agency; its President/Chairman is Senate-confirmed to a fixed term (Jovanovic confirmed
    51-47 on September 18, 2025, term expiring January 20, 2029) and chairs a five-member
    Senate-confirmed board (Commerce Secretary and USTR sit ex officio), and the bank is self-financing
    from interest and fees — appropriations only set administrative-expense limits — under
    a $135 billion statutory exposure cap.
  firepower:
  - instrument: Direct loans
    what: Medium- and long-term fixed-rate loans to foreign buyers of U.S. exports (e.g.,
      the $4.7 billion Mozambique LNG direct loan)
    capacity: Within the $135 billion statutory exposure cap; total portfolio exposure was
      $34.8 billion as of 2025-09-30, leaving roughly $100 billion of headroom
  - instrument: Loan guarantees
    what: Guarantees of commercial-bank financing to creditworthy foreign buyers of U.S. goods
      and services
    capacity: Within the $135 billion cap; FY2025 total authorizations across all products
      were $8.7 billion supporting an estimated $10.1 billion in exports
  - instrument: Export credit insurance
    what: Short- and medium-term insurance protecting exporters against foreign-buyer nonpayment
    capacity: $2.4 billion in short-term policies authorized in FY2025, of which $1.1 billion
      for small businesses
  - instrument: Working capital guarantees / domestic financing (Make More in America)
    what: Guarantees of exporters' working-capital lending plus domestic project financing
      for export-oriented U.S. manufacturing
    capacity: null
  - instrument: China and Transformational Exports Program (CTEP)
    what: Enhanced-terms financing to counter Chinese export credit in 10 transformational
      sectors (semiconductors, AI, biotech, renewable energy, etc.)
    capacity: 20% of total financing authority (about $27 billion) reserved by the 2019 charter
      reauthorization (not re-verified this session)
  - instrument: Strategic supply chain initiative
    what: Announced November 2025 plan to make available up to $100 billion for critical minerals,
      nuclear power, and natural gas supply chains for the U.S. and allies, including a roughly
      $4 billion Egypt gas guarantee
    capacity: Up to $100 billion (announced 2025-11; a plan/pipeline, not yet closed authorizations)
  track_record: In FY2025 EXIM authorized $8.7 billion in financing supporting an estimated
    $10.1 billion of U.S. exports, including $1.7 billion (19.4%) for small business, with
    exposure of $34.8 billion across 138 markets as of September 30, 2025. The signature 2025
    transaction was the board's unanimous March 13, 2025 vote to proceed with the amended
    $4.7 billion direct loan for the TotalEnergies Mozambique LNG project after a four-year
    delay; the project's sponsors announced a full restart in January 2026. In November 2025
    Jovanovic launched the up-to-$100 billion strategic supply chains push (critical minerals,
    nuclear, natural gas), and the restored three-member board quorum (via March 2025 acting
    appointments) has allowed large transactions to move after years of gridlock risk.
  mandate: Under the Export-Import Bank Act of 1945 (its charter), EXIM must support U.S.
    jobs by financing exports the private sector will not support on competitive terms — supplementing,
    not competing with, private capital — while maintaining reasonable assurance of repayment
    and countering foreign government export-credit competition. The charter also directs
    it to make a share of authority available to small business (statutory target of 25%)
    and to reserve 20% of financing authority for the China and Transformational Exports Program.
  cants: Its charter authority expires December 31, 2026 absent reauthorization, and a statutory
    2% portfolio default-rate cap freezes new lending if breached. Support is conditioned
    on U.S.-content and U.S.-flag shipping rules, is generally barred for military/defense
    exports and for deals that would substantially harm U.S. industry (economic-impact rules),
    cannot exceed the $135 billion exposure cap, and larger transactions (historically those
    above $10 million) require approval by a three-member board quorum.
  wants: 'In March 2026 reauthorization testimony before Senate Banking and House Financial
    Services, Jovanovic asked Congress for three things: a reauthorized charter including
    CTEP, relief from the constraints of the 2% default-rate cap, and hiring flexibility for
    specialized talent. The bank''s stated strategic priorities (FY2025 annual report ''Winning
    Globally in America''s Golden Age'' and the November 2025 announcement) are countering
    China and financing critical minerals, nuclear power, and natural gas/LNG supply chains,
    with up to $100 billion earmarked for that push.'
  reauth_or_risk: 'Charter expires December 31, 2026; reauthorization is actively pending
    in Congress as of mid-2026 (Jovanovic testified to Senate Banking and House Financial
    Services in March 2026; Senate Banking Chairman Scott is pushing a bill, while Sen. Warren
    raised transparency objections in June 2026). Secondary risks: two of five board seats
    vacant with the vice chairman serving in an acting capacity, and the 2% default-rate cap
    could freeze lending if breached.'
  usia_angle: Domestic financing with an export nexus (Make More in America) and the anti-PRC
    financing window (CTEP). Charter pressure makes them motivated to show strategic relevance
    — our deals are their story. Content rules bite; check eligibility early.
  matrix:
    runs: John Jovanovic
    firepower: $135B exposure cap (~$100B headroom); CTEP ~$27B reserve; new $100B supply-chain
      initiative
    done: 'FY25: $8.7B authorized supporting $10.1B exports; portfolio exposure $34.8B'
    must_cant: Finance exports the private sector won't / charter dies Dec 31 2026; 2% default
      cap; content rules
    wants: Reauthorization with CTEP expansion and a domestic/supply-chain financing mandate
    usia: Export-nexus financing; motivated by charter politics
  sources:
  - https://www.exim.gov/news/john-jovanovic-confirmed-chairman-export-import-bank-united-states
  - https://www.congress.gov/nomination/119th-congress/26/22
  - https://www.gtreview.com/news/americas/us-senate-confirms-trumps-pick-to-lead-us-exim/
  - https://img.exim.gov/s3fs-public/documents/exim-fy25-amr.pdf
  - https://img.exim.gov/s3fs-public/reports/annual/exim_annual-report_2025.pdf
  low_confidence:
  - The $10 million board-approval threshold for transactions is from widely reported coverage
    of the 2015-2019 quorum lapse and was not re-verified against the current charter this
    session.
  - The 25% small-business statutory target and the 20%/$27 billion CTEP set-aside are from
    prior CRS knowledge; FY2025 actual small-business share (19.4%) is verified, the statutory
    percentages were not re-read in the charter text.
  - Current board composition detail (two director vacancies; Spencer Bachus III as remaining
    Senate-confirmed director; Burrows still acting as of July 2026) is from search snippets
    of exim.gov leadership pages, which could not be fetched directly (HTTP 403 via proxy).

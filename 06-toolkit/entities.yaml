- key: ustda
  name: U.S. Trade and Development Agency (USTDA)
  short: USTDA
  group: independent
  principal:
    name: Thomas R. Hardy
    title: Deputy Director and Chief Operating Officer, performing the duties of the Director
    status: acting
    as_of: 2025-11
  working_level: Thomas R. Hardy doubles as the operational lead (career official, at USTDA
    since 1988; Acting Director Jan-Nov 2025); no separate Senate-confirmed Director identified,
    and no pending Director nomination found in the 119th Congress.
  situated: Independent federal agency in the foreign-affairs cluster, operating under the
    foreign policy guidance of the Secretary of State; its Director is a Senate-confirmed
    presidential appointee (post currently filled in an acting capacity), and it is funded
    through the State, Foreign Operations appropriations bill (about $87 million per year).
  firepower:
  - instrument: Project preparation grants
    what: Grants to overseas project sponsors for feasibility studies, technical assistance
      and pilot projects that tie emerging-market infrastructure projects to U.S. goods and
      services
    capacity: Funded from a total agency appropriation of $87.0 million in FY2024 and FY2025;
      FY2026 request also $87 million (agency operating under FY2026 continuing appropriations);
      individual grants are typically low seven figures
  - instrument: Reverse trade missions
    what: Brings foreign infrastructure decision-makers to the U.S. to meet American suppliers
      (2026 missions planned on grid security and midstream gas infrastructure)
    capacity: Within the same ~$87M annual appropriation
  - instrument: Global Procurement Initiative / training grants
    what: Trains foreign procurement officials in best-value, life-cycle procurement practices
      that improve U.S. firms' competitiveness
    capacity: null
  track_record: USTDA reported a near-record ten-year-average multiplier of $226 in U.S. exports
    per program dollar for FY2025 (after $231 in FY2024) and more than $127 billion in U.S.
    exports facilitated since 1992. It remained active through 2025-2026 — e.g., supporting
    Cote d'Ivoire's first major solar minigrid project and planning 2026 reverse trade missions
    on grid security and midstream gas — and was one of the only foreign-assistance agencies
    the Trump administration did not propose to cut or abolish in the FY2026 budget. Its interventions
    are small, early-stage and catalytic rather than deal-closing; export returns materialize
    over long infrastructure timelines.
  mandate: Permanently authorized under Section 661 of the Foreign Assistance Act of 1961,
    as amended (22 U.S.C. 2421), to promote U.S. private-sector participation in development
    projects in developing and middle-income countries — an explicit dual export-promotion
    and development mandate carried out through project preparation and partnership-building
    activities.
  cants: It does not finance project construction — no loans, guarantees, equity or insurance
    (that is DFC/EXIM territory); it can only fund planning-stage activities and events, and
    its activities must be tied to countries eligible under its statute and appropriations.
    Grants are conditioned on the use of U.S. firms/technology, and its total programming
    is bounded by a small (~$87M) annual appropriation.
  wants: Its FY2026 budget justification prioritizes U.S. 'energy dominance,' leadership in
    critical and emerging technologies, critical-minerals supply-chain development, and countering
    PRC economic influence in emerging markets. Pending FY2026 appropriations language (H.R.
    4779) would let it work in any country where the U.S. has strategic foreign-policy or
    national-security interests, subject to congressional consultation.
  reauth_or_risk: No authorization cliff — permanently authorized — but no Senate-confirmed
    Director since January 2025, FY2026 funding is via continuing appropriations (P.L. 119-37),
    and proposed FY2026 approps language would materially broaden its country-eligibility
    rules; the agency also faced restructuring uncertainty during the 2025 foreign-aid reorganization,
    though its FY2026 request survived intact at $87M.
  usia_angle: 'Small but useful upstream: feasibility and project-prep money for allied-supply-chain
    projects that feed our deals; cheap goodwill with partner governments.'
  matrix:
    runs: Thomas R. Hardy (acting)
    firepower: '~$87M/yr: feasibility studies, project prep, reverse trade missions — no financing'
    done: $127B+ exports facilitated cumulatively; $226 of exports per program dollar (10-yr
      avg)
    must_cant: Prepare overseas projects using U.S. tech / planning money only — no construction
      finance
    wants: Energy dominance, minerals supply chains, countering PRC procurement influence
    usia: Feasibility money for allied supply chains
  sources:
  - https://www.ustda.gov/staff/thomas-r-hardy-2/
  - https://www.congress.gov/crs-product/IF10673
  - https://www.ustda.gov/ustda-delivers-strong-export-results-for-american-taxpayers/
  - https://www.congress.gov/crs-product/R48624
  - https://www.ustda.gov/about/executive-staff/
  low_confidence:

      countries, historically up to about $1 billion per project
    capacity: Shares the $205 billion aggregate exposure ceiling (raised from $60 billion
      by the FY26 NDAA, signed 2025-12-18); total portfolio exposure was $43.4 billion across
      103 countries as of 2025-09-30
  - instrument: Equity investments
    what: Direct minority equity stakes, with ownership authority raised to up to 40% of a
      project by the 2025 reauthorization
    capacity: New $5 billion equity revolving fund at Treasury authorized in the FY26 NDAA
      (December 2025) to relieve budget-scoring constraints; funding subject to appropriations
  - instrument: Political risk insurance
    what: Coverage against expropriation, political violence, and currency inconvertibility,
      historically up to about $1 billion per project
    capacity: Within the $205 billion aggregate ceiling (as of 2025-12)
  - instrument: Investment funds
    what: Capital commitments to private investment funds targeting developing markets
    capacity: null
  - instrument: Technical assistance and feasibility studies
    what: Small grants to develop bankable projects alongside its financing
    capacity: null
  track_record: 'DFC hit a record of roughly $12 billion in new commitments in FY2024, then
    slowed sharply to about $3.6 billion across 30 transactions in FY2025 amid the administration
    transition and the October-December 2025 authorization lapse; total exposure stood at
    $43.4 billion in 103 countries as of September 30, 2025. Under CEO Black the 2025-2026
    signature moves are critical-minerals and strategic-infrastructure plays: a $600 million
    contribution to the $1.8 billion Orion Critical Minerals Consortium (with a further $900
    million board-approved), a signed loan agreement for the Lobito Atlantic Railway (DRC-Zambia-Angola
    corridor), standing up the U.S.-Ukraine Reconstruction Investment Fund, and June 2026
    board approvals including $1.5 billion for energy infrastructure across South and Southeast
    Asia and roughly $2.5 billion in strategic investments.'
  mandate: Under the BUILD Act of 2018, DFC must mobilize private capital for development-oriented
    investment in less-developed countries in support of U.S. foreign policy, complementing
    rather than competing with private finance. The DFC Modernization and Reauthorization
    Act of 2025 (enacted in the FY26 NDAA, P.L. 119-60, December 18, 2025) renewed and broadened
    this mandate through 2031 with a more explicit economic-statecraft/strategic-competition
    orientation.
  cants: It cannot invest in roughly the world's 20 wealthiest countries, and no more than
    10% of its $205 billion ceiling may be used in high-income countries; equity must remain
    minority positions (now up to 40% ownership). Total exposure is capped at $205 billion,
    and it is directed not to crowd out available private-sector financing.
  wants: 'CEO Black''s stated 2025-2026 agenda is ''economic statecraft'': securing critical-mineral

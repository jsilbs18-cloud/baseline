    as of July 2026 (agency web pages were unreachable through the network proxy; the Nov
    2025 title and a 2026 interview identifying him as Deputy Director are the latest evidence
    found).
  - Exact FY2026 enacted appropriation level (assumed continued at ~$87M under the FY2026
    CR; full-year figure not confirmed).
  - Absence of a pending Director nomination is based on search results not surfacing one,
    not on an exhaustive nominations-database check.
- key: sba-sbic
  name: Small Business Investment Company (SBIC) Program, U.S. Small Business Administration
  short: SBA SBIC
  group: independent
  principal:
    name: Kelly Loeffler
    title: Administrator, U.S. Small Business Administration (confirmed February 2025; testified
      before House Appropriations July 14, 2026)
    status: confirmed
    as_of: 2026-07
  working_level: Joshua (Josh) Carter, Associate Administrator, SBA Office of Investment and
    Innovation — the office that licenses and oversees SBICs; testified before the House Small
    Business Committee June 25, 2026.
  situated: A program of the SBA (independent agency; Administrator is Senate-confirmed and
    holds Cabinet rank in the current administration), run by the Office of Investment and
    Innovation; its capital comes from private investors in licensed funds plus SBA-guaranteed
    debentures sold to institutional investors with full-faith-and-credit backing, with the
    annual leverage ceiling set in appropriations acts and the program designed to operate
    at zero subsidy cost to taxpayers.
  firepower:
  - instrument: SBA-guaranteed debenture leverage
    what: Licensed private funds borrow up to roughly 2x their private capital at favorable
      rates via 100% SBA-guaranteed debentures
    capacity: Annual leverage commitment authorization of $5 billion (set for FY2023 and carried
      in subsequent appropriations); per-fund caps raised by the Investing in All of America
      Act (signed May 19, 2026) to $250M per fund / $475M per family of funds, from $175M/$350M
  - instrument: Bonus leverage exclusions
    what: Dollar-for-dollar exclusion from leverage caps for qualifying investments in rural
      small businesses, critical technologies, small manufacturers and low-income areas, up
      to the lesser of 50% of private capital or $125M (post-enactment investments only);
      leverage-increase requests due September 1, 2026
    capacity: New authority as of May 2026
  - instrument: Accrual debentures
    what: Patient-capital debenture (interest accrues to maturity) created by the 2023 SBIC
      reforms to accommodate equity-oriented and long-duration funds, including the joint
      SBA-DoD SBICCT critical-technology initiative
    capacity: null
  - instrument: Total program capital
    what: Combined private capital plus SBA leverage across all licensed SBICs
    capacity: Record $53 billion at FY2025 close, up from $46 billion in FY2024
  track_record: 'FY2025 was the program''s largest year ever: $53 billion in combined private
    capital and SBA leverage (vs. $46B in FY2024), 48 new SBIC licenses approved, and a record
    88 ''green light'' letters building a pipeline projected to drive roughly $27 billion
    of new private investment concentrated in manufacturing and critical technologies. A final
    rule modernizing SBIC regulations to channel capital toward critical industries took effect
    February 2, 2026, and the bipartisan Investing in All of America Act — House-passed unanimously
    December 1, 2025, Senate-cleared April 15, 2026, signed May 19, 2026 — sharply expanded
    leverage capacity. Licensing runs through a two-stage green-light/license process that
    historically takes many months, though SBA touts an accelerated pipeline.'
  mandate: Under the Small Business Investment Act of 1958, the program must stimulate and
    supplement the flow of private equity capital and long-term debt financing to U.S. small
    businesses by licensing, regulating and leveraging privately owned and managed investment
    funds — SBA provides guaranteed leverage, not direct investment.
  cants: SBA cannot invest directly in companies; capital flows only through licensed private
    funds, which must invest in U.S. small businesses meeting SBA size standards (with a required
    share to 'smaller enterprises') and are barred from financing passive businesses, re-lenders/re-investors,
    real estate and project finance, and most foreign operations. Leverage is capped per fund/family
    ($250M/$475M since May 2026, plus bounded exclusions) and by the annual government-wide
    leverage commitment level set in appropriations.
  wants: Stated 2025-2026 priorities are steering SBIC capital into manufacturing, critical
    technologies, defense-industrial-base and rural/low-income investment (the January 2026
    final rule and the Investing in All of America Act both explicitly target these), with
    Administrator Loeffler framing the program as part of an 'onshoring' and industrial-strength
    agenda; SBA expects to support roughly $6 billion in private capital through the program
    in FY2026.
  reauth_or_risk: No reauthorization cliff — permanently authorized under the 1958 Act with
    annual leverage levels set in appropriations; near-term dates are implementation of the
    February 2, 2026 final rule and the September 1, 2026 deadline for existing SBICs to request
    increased leverage under the new statutory caps.
  usia_angle: 'Fund-level, not deal-level: SBIC leverage multiplies private capital into critical-tech
    funds. Pair with OSC for a two-agency answer when the right vehicle is a fund rather than
    a project.'
  matrix:
    runs: Kelly Loeffler
    firepower: $5B/yr guaranteed leverage to licensed funds; $53B total program capital (record
      FY25)
    done: 'FY25 biggest year ever: 48 new SBIC licenses, record green-lights'
    must_cant: Capital to small business via private funds / no direct investing; size standards
      apply
    wants: Steer SBIC capital into manufacturing, critical tech, defense industrial base
    usia: Fund-level leverage for critical-tech capital
  sources:
  - https://www.sba.gov/article/2025/11/19/sbas-sbic-program-delivers-record-capital-fy25
  - https://sbia.org/2026/06/30/small-business-committee-hearing-highlights-sbic-success-impact-of-bipartisan-investing-in-all-of-america-act/

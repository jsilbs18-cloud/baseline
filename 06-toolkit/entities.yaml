- key: treasury
  name: 'U.S. Department of the Treasury (investment-relevant functions: 48D/45X/48C tax credit
    administration, CFIUS chairmanship, sovereign wealth fund initiative)'
  short: Treasury
  group: other
  principal:
    name: Scott Bessent
    title: Secretary of the Treasury (confirmed January 2025; in office as of Senate Finance
      testimony and CFIUS correspondence in June 2026)
    status: confirmed
    as_of: 2026-07
  working_level: Christopher Pilkerton, Assistant Secretary for Investment Security (leads
    CFIUS staff; confirmed by the Senate December 18, 2025). On tax administration, Kenneth
    Kies served as Assistant Secretary for Tax Policy from June 2025 but his departure was
    announced in July 2026.
  situated: Cabinet executive department; the Senate-confirmed Secretary answers to the President,
    statutorily chairs CFIUS, and administers investment tax credits that operate as uncapped
    mandatory spending through the tax code rather than annual appropriations (Treasury/IRS
    write the rules and pay the credits, including elective-pay refunds).
  firepower:
  - instrument: Section 48D Advanced Manufacturing Investment Credit (CHIPS ITC)
    what: Investment tax credit for semiconductor and semiconductor-equipment manufacturing
      facilities, with direct-pay election; raised from 25% to 35% by the One Big Beautiful
      Bill Act (July 2025) for property placed in service after December 31, 2025
    capacity: Uncapped (open-ended tax expenditure), but only for facilities whose construction
      begins before January 1, 2027
  - instrument: Section 45X Advanced Manufacturing Production Credit
    what: Per-unit production credit for U.S.-made batteries, solar and wind components, inverters
      and critical minerals (metallurgical coal added at 2.5% by OBBBA), now subject to prohibited-foreign-entity/'material
      assistance' restrictions
    capacity: Uncapped; wind components terminate after 2027 and most credits phase down starting
      2030 and end after 2032
  - instrument: Section 48C Qualifying Advanced Energy Project Credit
    what: Competitively allocated 30% ITC for clean-energy manufacturing, recycling and industrial-decarbonization
      projects, run jointly with DOE
    capacity: $10 billion cap fully allocated ($4B in March 2024, $6B announced January 2025);
      no remaining capacity, and OBBBA eliminated re-allocation of forfeited awards
  - instrument: CFIUS chairmanship
    what: Regulatory power (not dollars) to review, mitigate, or recommend blocking covered
      foreign investments, including negotiating national security agreements with structural
      conditions
    capacity: Not a funded instrument; leverage demonstrated by the June 2025 U.S. Steel golden-share
      NSA tied to $11 billion in committed Nippon Steel investment by 2028
  - instrument: U.S. sovereign wealth fund initiative (EO 14196)
    what: February 3, 2025 executive order directed Treasury and Commerce to deliver a plan
      for a U.S. sovereign wealth fund within 90 days
    capacity: No capital — the plan was submitted around May 2025, parts were rejected by
      the White House, and reporting indicates the formal SWF was shelved as a lower priority
      as of mid-2026; the administration pivoted to ad hoc direct equity stakes and golden
      shares instead
  track_record: Treasury/IRS fully allocated the $10B Section 48C program across two rounds
    (March 2024 and January 2025) and administer the uncapped 48D and 45X credits that have
    supported the post-CHIPS/IRA semiconductor and clean-manufacturing build-out, with OBBBA
    (signed July 4, 2025) raising 48D to 35% while layering foreign-entity restrictions onto
    45X. As CFIUS chair, Bessent's Treasury ran the de novo re-review that reversed the January
    2025 prohibition of Nippon Steel's acquisition of U.S. Steel, closing it in June 2025
    under an unprecedented national security agreement featuring a U.S. government golden
    share and $11B in committed investment, implementing the February 2025 'America First
    Investment Policy' memorandum (fast-track for allies, tighter scrutiny of China-linked
    deals); in 2026 senators pressed CFIUS to review the Paramount-Warner Bros. transaction
    over foreign sovereign-wealth capital. The sovereign-wealth-fund plan Bessent co-authored
    with Commerce Secretary Lutnick was submitted in May 2025 but never adopted, and no U.S.
    SWF existed as of mid-2026.
  mandate: Treasury must administer the internal revenue laws — including paying the 48D,
    45X and 48C credits as enacted in the CHIPS and Science Act (2022) and the Inflation Reduction
    Act (2022) as amended by the One Big Beautiful Bill Act (2025) — and the Secretary statutorily
    chairs CFIUS under Section 721 of the Defense Production Act (as amended by FIRRMA), with
    EO 14196 additionally tasking Treasury to develop (not create) a sovereign wealth fund
    plan.
  cants: 'Treasury cannot expand or extend the tax credits beyond statute: 48D dies for construction
    starting after 2026, 48C''s $10B is exhausted, and 45X phases out on a fixed schedule
    with prohibited-foreign-entity exclusions; the credits go only to taxpayers meeting statutory
    eligibility, not discretionary picks. CFIUS jurisdiction covers only ''covered transactions''
    (foreign acquisitions/investments and certain real estate — generally not greenfield investment),
    and Treasury cannot capitalize a sovereign wealth fund without congressional authorization
    and appropriation, a key legal obstacle in the reported shelving of the plan.'
  wants: '2025-2026 priorities: implement the America First Investment Policy — welcoming
    and fast-tracking allied capital while restricting adversary (especially PRC-linked) investment,
    and using CFIUS conditions aggressively (golden share model) to extract binding U.S. investment
    commitments; implement OBBBA''s reshaped credits favoring semiconductors and non-wind/solar
    manufacturing with strict foreign-entity guardrails. The formal SWF ambition persists
    rhetorically but has been deprioritized in favor of transaction-by-transaction government
    equity stakes.'
  reauth_or_risk: 'Section 48D effectively expires for facilities not under construction by
    December 31, 2026 — an imminent cliff; 45X wind-component credits end after 2027 with
    broader phase-down from 2030; 48C has no remaining capacity; the SWF initiative is stalled
    without congressional action; CFIUS authority is permanent. Leadership churn risk: the
    Assistant Secretary for Tax Policy announced departure in July 2026 amid broader IRS leadership
    turnover.'
  usia_angle: 'Tax credits are the cheapest, most rule-based dollars in every package — compute
    them first; they shrink what the sovereign pool must carry. CFIUS matters doubly for us:
    our own capital IS foreign sovereign money flowing into US strategic infrastructure, so
    alignment with the screening arm on structure and governance rights is existential, not
    optional. Watch Treasury as the natural turf claimant on anything labeled a sovereign
    fund.'
  matrix:
    runs: Scott Bessent
    firepower: 48D uncapped (construction must start before 2027); 45X uncapped; 48C exhausted;
      CFIUS chair
    done: $10B 48C fully allocated; administers 48D/45X behind the fab boom; US Steel golden-share
      NSA (2025)
    must_cant: Administer credits as written / cannot extend them — 48D cliff Dec 2026
    wants: 'America First Investment Policy: fast-track allied capital, restrict PRC-linked'
    usia: Tax credits first; CFIUS alignment existential — our capital is foreign
  sources:
  - https://home.treasury.gov/about/general-information/officials/scott-bessent
  - https://exportcompliancedaily.com/article/2025/12/22/senate-confirms-treasurys-cfius-leader-terrorist-financing-head-2512190065
  - https://www.kirkland.com/publications/kirkland-alert/2025/08/one-big-beautiful-bill-act-brings-big-changes-to-green-energy-tax-credits
  - https://www.steptoe.com/en/news-publications/the-one-big-beautiful-bill-impact-on-the-iras-clean-energy-tax-credits.html
  - https://www.energy.gov/infrastructure/qualifying-advanced-energy-project-credit-48c-tax-credit-program
  low_confidence:
  - SWF status ('shelved,' 'lower priority') rests on Bloomberg-sourced secondary reporting,
    not any official Treasury statement; no formal termination of EO 14196 was found.
  - Whether a successor to Kenneth Kies as Assistant Secretary for Tax Policy was in place
    by late July 2026 could not be verified.
  - The precise OBBBA treatment of forfeited 48C allocations (vanishing rather than re-pooled)
    is from practitioner summaries, not primary statutory text reviewed directly.
  - Dollar totals actually claimed to date under 48D and 45X were not verified (no consolidated
    official tally found).
- key: usda-rd
  name: U.S. Department of Agriculture, Rural Development (Rural Business-Cooperative Service
    business, energy and biorefinery finance programs)
  short: USDA Rural Dev
  group: other
  principal:
    name: Todd Lindsey
    title: Acting Under Secretary of Agriculture for Rural Development
    status: acting
    as_of: 2026-07
  working_level: J.R. Claeys, Administrator, Rural Business-Cooperative Service (in post since
    June 2, 2025); Victoria Collin, Deputy Administrator
  situated: A mission area of USDA headed by a Senate-confirmed Under Secretary reporting
    to the Secretary of Agriculture (post vacant; nominee Glen Smith advanced out of Senate
    Agriculture Committee 12-11 on June 8, 2026 but awaits a floor vote), funded through annual
    Agriculture appropriations (credit-subsidy and grant accounts) plus Farm Bill mandatory
    funds.
  firepower:
  - instrument: Business & Industry (B&I) Guaranteed Loans (OneRD)
    what: Federal guarantees (now up to 90% for loans under $5M after March 2026 fee notice)
      on private-lender loans to rural businesses, generally up to $25M per borrower
    capacity: ≈$3.5B obligated in FY2025 (record year, per industry analysis); subsidy rate
      0.20% in FY2025; FY2026 Agriculture appropriations continued roughly $1.8-2B-scale program
      levels despite a Presidential budget proposal to terminate the program
  - instrument: Section 9003 Biorefinery, Renewable Chemical, and Biobased Product Manufacturing
      Assistance Program
    what: Loan guarantees up to $250M per project for first-of-a-kind advanced biofuel, renewable
      chemical, and biobased manufacturing facilities; program rule overhauled by final rule
      effective July 9, 2026
    capacity: Up to $250M/project; remaining mandatory Farm Bill funding balance not publicly
      verified; pending bipartisan bill (Nunn-Budzinski, May 2025) would add $100M mandatory
      over 5 years
  - instrument: Rural Energy for America Program (REAP)
    what: Grants and loan guarantees for renewable-energy systems and energy-efficiency improvements
      for rural small businesses and ag producers
    capacity: Farm Bill mandatory baseline ~$50M/yr plus appropriations; status of remaining
      Inflation Reduction Act supplemental funds after 2025 rescission activity unverified
  - instrument: Rural Business Investment Program (RBIP)
    what: Licenses/certifies private Rural Business Investment Companies to raise and deploy
      private equity capital in rural businesses (no federal leverage since 2018 Farm Bill
      era)
    capacity: Private capital vehicles; USDA certified the Farmers Innovation Fund as a new
      fund in 2026
  - instrument: Rural Economic Development Loan & Grant (REDLG)
    what: Zero-interest loans and grants passed through rural electric/telephone utilities
      to local business projects
    capacity: FY2026 Notice of Funding Opportunity published September 15, 2025 (tens of millions
      annually)
  track_record: The B&I guarantee program had a record year in FY2025 with roughly $3.5B in
    guaranteed loan volume at a 0.20% subsidy rate, and cumulative core obligations of about
    $13.4B over the prior decade. Recent 2025-2026 activity includes an $80M package of loan
    guarantees announced July 23, 2026 to expand timber production in Oregon and Nevada, roughly
    $294M in RD investments in West Virginia announced March 2026, 2026 certification of the
    Farmers Innovation Fund as a Rural Business Investment Company, and a July 2026 final
    rule streamlining the Section 9003 biorefinery loan guarantee program. The agency also
    cut OneRD guarantee fees and raised the guarantee to 90% for small B&I loans in its March
    2026 fee notice.
  mandate: Under the Consolidated Farm and Rural Development Act and Farm Bill Titles VI and
    IX, RD/RBCS must improve the economy and quality of life in rural America by providing
    loans, loan guarantees, and grants that create rural jobs and business opportunity, including
    a statutory mandate (Section 9003) to finance first-of-a-kind advanced biofuel, renewable
    chemical, and biobased manufacturing.
  cants: Business programs are restricted to rural areas (B&I generally limited to communities
    of 50,000 or fewer and adjacent urbanized areas) and mostly cannot lend directly (guarantees
    only, except pass-through vehicles like REDLG); Section 9003 guarantees are capped at
    $250M per project. Program authorities run on the 2018 Farm Bill as extended, which expires
    September 30, 2026, and guarantee volume depends on annually appropriated credit subsidy.
  wants: '2025-2026 priorities under the current administration: streamlining and speeding
    OneRD guaranteed lending (lower fees, higher guarantee percentages, modernized NEPA rules),
    supporting domestic energy/biofuels, timber, and manufacturing supply chains, and a USDA-wide
    reorganization moving staff closer to rural communities. The FY2026 President''s Budget
    proposed terminating B&I (arguing private markets suffice) and floated moving business
    programs toward SBA — Congress instead continued funding.'
  reauth_or_risk: 2018 Farm Bill extension (enacted November 12, 2025 in H.R. 5371) expires
    September 30, 2026, putting Section 9003 and other Title VI/IX authorities at a cliff;
    the FY2026 President's Budget proposed eliminating the B&I program (rejected by appropriators
    so far); the Under Secretary post is unfilled pending Glen Smith's full Senate vote; USDA's
    mass reorganization/relocation is ongoing.
  usia_angle: Rural-sited plants and biomanufacturing. Their eligibility map should be an
    input at site selection, not an afterthought discovered at structuring.
  matrix:
    runs: Todd Lindsey (acting)
    firepower: B&I loan guarantees (~$3.5B FY25); 9003 biorefinery up to $250M/project; REAP
    done: Record FY25 B&I year (~$3.5B); ~$13.4B cumulative core obligations
    must_cant: Rural economic development / rural areas only (≤50k pop.); mostly guarantees
    wants: Faster OneRD lending; biomanufacturing; Farm Bill stability (extension expires
      Sept 2026)
    usia: Rural siting + bio; check eligibility at site selection
  sources:
  - https://www.usda.gov/about-usda/news/press-releases/2026/07/23/usda-announces-80-million-investment-expand-timber-production-and-enhance-forest-health-nevada-and
  - https://en.wikipedia.org/wiki/Under_Secretary_of_Agriculture_for_Rural_Development
  - https://www.agriculture.senate.gov/newsroom/rep/press/release/ag-committee-advances-under-secretary-of-agriculture-for-rural-development-nominee
  - https://www.rd.usda.gov/about-rd/leadership/administrators/jr-claeys
  - https://www.mmcginvest.com/post/the-annual-state-of-usda-rural-development-financing-2026a-record-year-a-delinquency-cycle-and-th
  low_confidence:
  - Whether Glen Smith received a full Senate confirmation vote between June 8 and July 27,
    2026 (no evidence found; treated as still pending)
  - FY2025 B&I obligation figure (~$3.5B) comes from a private analytics firm (MMCG Invest),
    not verified against official USDA data
  - Exact FY2026 enacted program level for B&I (~$1.8B figure from a secondary summary)
  - Remaining unobligated balance of Section 9003 mandatory funding
  - Status of IRA supplemental REAP funds after 2025 rescission legislation
  - Whether Victoria Collin is currently acting RBCS Administrator vs. Deputy (one July 2026
    reference conflicted with Claeys as Administrator)
- key: dot-bab
  name: Build America Bureau (National Surface Transportation and Innovative Finance Bureau),
    U.S. Department of Transportation
  short: DOT Build America
  group: other
  principal:
    name: Morteza Farajian
    title: Executive Director, Build America Bureau
    status: confirmed
    as_of: 2026-07
  working_level: null
  situated: Sits inside the Office of the Secretary of Transportation (under the Under Secretary
    for Policy); its Executive Director is a non-Senate-confirmed official (Farajian has led
    it since April 2019 across three administrations) answering to the Secretary, with lending
    capacity funded by IIJA/appropriated credit subsidy and statutory loan authorizations
    rather than grant appropriations.
  firepower:
  - instrument: TIFIA direct loans/credit assistance
    what: Low-interest (Treasury-rate) loans and credit support for up to 33% (49% for transit
      and TOD) of eligible surface-transportation project costs
    capacity: IIJA provided ~$1.25B in credit subsidy FY2022-26 (~$250M/yr), each subsidy
      dollar supporting roughly $10-14 in loans; Bureau credit portfolio ~$29B (2024-25);
      House BUILD America 250 Act would provide $1.25B over FY2027-31
  - instrument: RRIF direct loans
    what: Loans for up to 100% of eligible railroad rehabilitation/improvement and transit-oriented
      development costs
    capacity: $35B statutory lending authorization, the large majority historically unused
      (roughly $25-28B headroom per CRS); Brightline West has a $21.05B RRIF request in the
      Bureau's June 1, 2026 pipeline
  - instrument: Transportation Private Activity Bonds (PABs)
    what: Allocations of tax-exempt bond authority to private developers in surface-transportation
      P3s
    capacity: $30B national cap (doubled from $15B by IIJA in 2021) essentially exhausted
      — about $29B allocated as of October 2025; DOT is asking Congress to raise the cap
  - instrument: Project development / technical assistance (incl. Regional Infrastructure
      Accelerators, Asset Concessions program)
    what: Pre-development grants and advisory support to build a P3 and TOD deal pipeline
    capacity: P3/credit pipeline pending before the Bureau of roughly $50B (2025-26)
  track_record: Since its 2016 creation the Bureau has built a credit portfolio of roughly
    $29B in TIFIA/RRIF loans plus over $22B (now ~$29B allocated) in PABs supporting megaprojects
    such as Brightline Florida and numerous managed-lanes and transit P3s. Recent activity
    includes a $291.2M RRIF loan to MBTA for the Widett Circle project (announced January
    2025), the first-ever transit-oriented-development TIFIA loan, and $327M in TIFIA and
    RRIF loans to Sound Transit for three projects (2026). Underwriting has historically taken
    a year or more, and in 2025 Secretary Duffy announced policy changes to remove financing
    roadblocks and speed closings; the June 1, 2026 pipeline report shows tens of billions
    in pending letters of interest including Brightline West's $21.05B RRIF request.
  mandate: Created by the FAST Act of 2015 as the National Surface Transportation and Innovative
    Finance Bureau, it must administer DOT's credit programs (TIFIA, 23 U.S.C. 601-609; RRIF,
    45 U.S.C. 821-823), allocate transportation PABs (26 U.S.C. 142(m)), and provide technical
    assistance to accelerate delivery of transportation infrastructure and attract private
    co-investment.
  cants: 'It is a financing shop, not a grantmaker: TIFIA is capped at 33% (49% for some categories)
    of eligible costs, requires investment-grade creditworthiness and dedicated repayment
    streams, and all credit is contingent on available subsidy authority; RRIF is limited
    to rail/TOD purposes; PAB allocations are hard-capped at $30B and are now nearly gone.
    Borrowers must satisfy federal cross-cutting requirements (NEPA, Buy America, Davis-Bacon),
    and current TIFIA contract authority runs on the IIJA, which expires September 30, 2026.'
  wants: '2025-2026 leadership priorities: dramatically expand P3s and private capital in
    infrastructure, get Congress to lift the PAB cap and expand TIFIA/RRIF in the next surface
    bill, push TIFIA into transit-oriented development, housing-adjacent, and airport projects,
    and cut approval timelines (Duffy''s 2025 removal of financing policy roadblocks; NEPA
    streamlining for TOD in the pending House bill).'
  reauth_or_risk: IIJA surface-transportation authorization (including TIFIA contract authority)
    expires September 30, 2026; the House T&I Committee approved the successor BUILD America
    250 Act ($580B, 5 years, incl. $1.25B TIFIA and modest TIFIA/RRIF expansions) 62-2 on
    May 22, 2026, but the Senate has not moved a companion; the $30B PAB cap is effectively
    exhausted pending congressional action.
  usia_angle: TIFIA/RRIF finance the roads and rail around a megasite — never the plant itself.
    Bring them in during site diligence for the enabling- infrastructure layer of the package.
  matrix:
    runs: Morteza Farajian
    firepower: TIFIA (~10–14× per subsidy $); RRIF $35B authority (~$25B headroom); PAB cap
      ~exhausted
    done: ~$29B credit portfolio + ~$29B PABs (Brightline…); ~$50B P3 pipeline pending
    must_cant: Administer DOT credit programs / infrastructure only; TIFIA ≤33% of costs;
      investment-grade
    wants: Expand P3s; lift PAB cap; TIFIA/RRIF growth in the next surface bill (auth expires
      Sept 2026)
    usia: Enabling infrastructure around megasites
  sources:
  - https://www.transportation.gov/leadership-and-key-officials
  - https://www.transportation.gov/buildamerica/about
  - https://www.appropriations.senate.gov/download/240618-farajian-thud-testimony&download=1
  - https://www.bondbuyer.com/news/dot-officials-pushing-for-more-private-activity-bonds
  - https://reason.org/commentary/congress-remove-cap-on-private-activity-bonds-for-public-private-partnership-projects/
  low_confidence:
  - Farajian's incumbency as of July 2026 is supported by DOT's leadership directory and continuing
    references but not by a dated July-2026 primary document
  - Exact remaining RRIF headroom (~$25-28B) and remaining IIJA TIFIA subsidy balance not
    re-verified for 2026
  - Precise closing date of the $327M Sound Transit TIFIA/RRIF loans (2026, month unverified)
  - Identity of the current Director of the Bureau's Office of Credit Programs (working-level
    lead) could not be verified for 2026
  - Portfolio figures ($29B credit / $22-29B PABs) mix 2024 testimony and 2025 reporting
  - 'Verifier (reauth): corrected — The House T&I Committee vote on the BUILD America 250
    Act (H.R. 8870) on May 22, 2026 was 61-2 per NACo''s markup report, not 62-2. The rest
    checks out: IIJA surface transportation authorization expires September 30, 2026; the
    bill authorizes ~$580B over 5 years (FY2027-31) including $1.25B for TIFIA; no evidence
    of a Senate companion moving was found. The claim that the $30B PAB cap is effectively
    exhausted could not be independently re-verified (Bureau pages unreachable), though bios
    already showed $22B+ allocated/issued/pending.'
- key: hhs-barda
  name: Biomedical Advanced Research and Development Authority (BARDA), Administration for
    Strategic Preparedness and Response (ASPR), U.S. Department of Health and Human Services
    — including ASPR industrial-base expansion (IBx/IBMSC) investments
  short: HHS BARDA
  group: other
  principal:
    name: Gary L. Disbrow
    title: Deputy Assistant Secretary and Director, BARDA
    status: confirmed
    as_of: 2026-07
  working_level: null
  situated: BARDA sits inside ASPR at HHS; its career Director reports to the Senate-confirmed
    Assistant Secretary for Preparedness and Response — a post vacant since January 20, 2025
    (nominee Sean Kaufman's HELP Committee vote was postponed July 23, 2026) — and the agency
    is funded through annual Labor-HHS appropriations (BARDA ARD line, Project BioShield Special
    Reserve Fund, pandemic influenza line) plus emergency supplementals, amid a contested
    March 2025 HHS reorganization that would move ASPR into CDC.
  firepower:
  - instrument: BARDA advanced R&D contracts (ARD line)
    what: Cost-shared advanced development contracts and other transactions carrying medical
      countermeasures from candidate through FDA approval
    capacity: Roughly $1B/yr discretionary (FY2025 enacted ~$1.0B; FY2026 request was $654M
      but Senate appropriators flat-funded or increased; FY2027 request cuts the line by $395.6M)
  - instrument: Project BioShield Special Reserve Fund
    what: Multi-year procurement of medical countermeasures against DHS-designated material
      threats, creating a guaranteed government market
    capacity: ≈$850M enacted FY2026; FY2027 request $725M (a $125M cut)
  - instrument: BioMaP-C (Biopharmaceutical Manufacturing Preparedness Consortium) / ASPR
      IBx-IBMSC onshoring awards
    what: Other-transaction consortium awards to build and sustain domestic commercial-scale
      manufacturing of essential medicines, APIs, antimicrobials, and large-volume parenterals
    capacity: Hundreds of millions in awards to date; new RPP issued 2026 for drug substance/drug
      product capacity (no published ceiling verified)
  - instrument: BARDA Ventures (with Global Health Investment Corp)
    what: Venture-capital-style equity investments in health-security technologies
    capacity: Planned up to ~$500M over 10 years from 2021 launch (current pace unverified)
  track_record: 'Since 2006 BARDA has shepherded scores of FDA-approved/licensed countermeasures
    and executed the largest US biomedical surge in history during COVID-19 (Operation Warp
    Speed vaccines and therapeutics). In 2025-2026 the portfolio pivoted sharply: HHS cancelled
    roughly $500M of BARDA mRNA vaccine projects (22 awards) in August 2025 and terminated
    Moderna''s $590M pre-pandemic flu award in June 2026, while expanding domestic-manufacturing
    investment through BioMaP-C awards for essential medicines and committing $50M in June
    2026 for Bundibugyo Ebola countermeasures amid the DRC outbreak. ASPR''s IBx/IBMSC has
    concurrently funded onshoring of API and sterile-injectable capacity to reduce foreign
    dependence.'
  mandate: Under PHS Act Section 319L (created by the Pandemic and All-Hazards Preparedness
    Act of 2006) BARDA must support advanced research, development, and procurement of medical
    countermeasures against CBRN threats, pandemic influenza, and emerging infectious diseases,
    bridging the 'valley of death' between NIH research and FDA approval; the Project BioShield
    Act of 2004 directs SRF procurement against material threats, and ASPR is separately charged
    with strengthening the medical industrial base and supply chains.
  cants: BARDA cannot fund basic research (advanced development only), and BioShield SRF purchases
    are limited to countermeasures against formally designated material threats; it is a funder,
    not a regulator, and depends on FDA action for approvals. Core PAHPA authorities lapsed
    September 30, 2023 and remain unreauthorized as of mid-2026, leaving programs running
    on appropriations, and statute requires the ASPR to report directly to the HHS Secretary
    — one legal obstacle to the proposed transfer into CDC.
  wants: FY2027 request and 2025-2026 leadership statements prioritize onshoring and expanding
    domestic MCM and essential-medicine manufacturing (IBx, BioMaP-C), late-stage development
    and stockpiling against DHS material threats, and — per HHS political leadership — a deliberate
    wind-down of mRNA platform investment in favor of other vaccine platforms.
  reauth_or_risk: PAHPA reauthorization has been pending since authorities lapsed September
    30, 2023 (still being urged on Congress as of June 2026); the March 2025 HHS reorganization
    moving ASPR into CDC is partially enjoined (July 2025 Rhode Island preliminary injunction)
    though the Supreme Court stayed a related workforce injunction; the ASPR post is vacant
    with Kaufman's committee vote postponed July 23, 2026; the FY2027 budget requests a $395.6M
    cut to BARDA and $125M cut to BioShield.
  usia_angle: 'Pharma-onshoring co-investor: grants plus procurement demand. Health-security
    framing is the key that unlocks their money for our API/biomanufacturing deals.'
  matrix:
    runs: Gary L. Disbrow
    firepower: ~$1B/yr advanced R&D; ~$850M BioShield fund; BioMaP-C manufacturing consortium
    done: Scores of FDA-approved countermeasures; Operation Warp Speed; now onshoring API
      manufacturing
    must_cant: Advanced development of medical countermeasures / no basic research; designated
      threats only
    wants: Onshore essential-medicine and MCM manufacturing; late-stage development
    usia: Pharma co-investor; frame as health security
